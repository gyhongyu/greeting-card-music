<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Greeting Card - CardForge</title>
    
    <!-- 首頁智慧路由 (若無受眾卡片參數，自動進入創作者工坊 workspace.html) -->
    <script>
        (function() {
            var params = new URLSearchParams(window.location.search);
            var isRecipientView = params.has('card') || params.has('id') || params.has('preview');
            if (!isRecipientView) {
                window.location.replace('workspace.html');
            }
        })();
    </script>
    
    <!-- Fonts & Tailwind -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Jost:wght@200;300;400;500;600&family=Noto+Serif+TC:wght@300;400;600&family=Noto+Sans+TC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    
    <!-- Three.js (For 3D Particle Planet & Hologram Effects) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- React & Babel -->
    <script src="https://resource.trickle.so/vendor_lib/unpkg/react@18/umd/react.production.min.js"></script>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/@babel/standalone/babel.min.js"></script>

    <!-- Custom Styles -->
    <link href="styles/animations.css" rel="stylesheet">
    <link href="styles/templates.css" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: 'Jost', system-ui, sans-serif;
            width: 100%;
            height: 100%;
            min-height: 100dvh;
            overflow: hidden;
            position: fixed;
        }

        /* Recipient Discreet Audio Pill */
        .audio-pill-btn {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 50;
            width: 36px;
            height: 36px;
            border-radius: 9999px;
            background: rgba(15, 17, 23, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .audio-pill-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            transform: scale(1.05);
        }
    </style>
</head>
<body id="app-body">
    <div id="root"></div>

    <!-- Configuration & Pure JS (原生載入無 CORS 限制) -->
    <script src="core/BackdropShader.js"></script>
    <script src="core/ParticleEngine.js"></script>
    <script src="js/constants.js"></script>
    <script src="js/config.js"></script>
    <script src="js/gas_client.js"></script>
    <script src="core/CardEngine.js"></script>
    <script src="js/workspace_store.js"></script>

    <!-- 
      重要說明：
      在 file:/// 協議下，Babel 無法透過 XHR 讀取外部 JSX 檔案 (會被 Chrome CORS 阻擋)。
      純 JS 模組 (CardEngine, ParticleEngine, constants, config, gas_client) 走原生 script 標籤載入，
      頂層 React 視圖路由維持內聯，保證 100% 模組化且零伺服器本機雙擊秒開！
    -->
    <script type="text/babel">
        // 引用外部已模組化的核心渲染舞台 (core/CardEngine.js)
        const CardEngine = window.CardEngine;

        // =========================================================================
        // 2. CHILD COMPONENTS (受眾端子組件)
        // =========================================================================
        
        // 開門封面遮罩 (解鎖 Web Audio 與進入全螢幕)
        function WelcomeGate({ card, template, onStart }) {
            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center relative z-20 bg-black">
                    <ParticleEngine effect={template.effects} />
                    
                    <div className="max-w-md w-full p-8 md:p-10 rounded-2xl bg-zinc-900/80 backdrop-blur-2xl border border-white/15 shadow-2xl space-y-6">
                        <h1 className="text-3xl md:text-4xl font-light text-white" style={{ fontFamily: template.theme?.fontFamily }}>
                            {card.title || '一份特別的祝福'}
                        </h1>
                        <p className="text-sm text-zinc-400">
                            {card.recipient ? `致 ${card.recipient}` : '請點擊開啟專屬沉浸式卡片'}
                        </p>
                        
                        <button
                            onClick={onStart}
                            className="w-full py-3.5 px-6 rounded-xl font-medium tracking-wide transition-all duration-300 transform active:scale-95 shadow-lg flex items-center justify-center gap-2 group"
                            style={{
                                backgroundColor: template.theme?.primaryColor || '#c9a96e',
                                color: template.theme?.bgColor || '#09090b'
                            }}
                        >
                            <i className="fa-solid fa-envelope-open text-sm group-hover:scale-110 transition-transform"></i>
                            <span>開啟賀卡與音樂體驗</span>
                        </button>
                        
                        <div className="text-[11px] text-zinc-500 flex items-center justify-center gap-1.5 pt-2">
                            <i className="fa-solid fa-headphones text-[10px]"></i>
                            <span>佩戴耳機或開啟聲音體驗最佳</span>
                        </div>
                    </div>
                </div>
            );
        }

        // 音訊控制浮鈕 (受眾端極簡半透明藥丸鈕，不論本地預覽或受眾皆純淨無色票)
        function AudioControls({ isPlayingAudio, onToggleAudio }) {
            return (
                <button
                    onClick={onToggleAudio}
                    title={isPlayingAudio ? "暫停音樂" : "播放音樂"}
                    className="audio-pill-btn"
                >
                    <i className={`fa-solid ${isPlayingAudio ? 'fa-volume-high' : 'fa-volume-xmark'} text-xs`}></i>
                </button>
            );
        }

        // =========================================================================
        // 3. CARD PLAYER APP (受眾端播放器主入口)
        // =========================================================================
        function CardPlayerApp() {
            const [templates, setTemplates] = React.useState([]);
            const [currentCard, setCurrentCard] = React.useState(null);
            const [activeTemplateId, setActiveTemplateId] = React.useState(null);
            const [isStarted, setIsStarted] = React.useState(false);
            const [isPlayingAudio, setIsPlayingAudio] = React.useState(false);
            const [isPreviewMode, setIsPreviewMode] = React.useState(false);
            const audioRef = React.useRef(null);

            // 初始化卡片與模板數據 (透過 WorkspaceStore 與 GasClient SSOT)
            React.useEffect(() => {
                async function initData() {
                    try {
                        const { cards: loadedCards, templates: loadedTemplates } = await window.WorkspaceStore.loadInitialData();
                        setTemplates(loadedTemplates || []);

                        const urlParams = new URLSearchParams(window.location.search);
                        const cardIdParam = urlParams.get('id') || urlParams.get('card');
                        const templateParam = urlParams.get('template');
                        const previewParam = urlParams.get('preview');

                        setIsPreviewMode(previewParam === '1' || previewParam === 'true');

                        // =========================================================
                        // 🔍 超詳細 DEBUG 監控面板 (Console 實時透視)
                        // =========================================================
                        console.group("%c🎴 CardForge 播放器卡片加載追蹤", "color: #38bdf8; font-weight: bold; font-size: 13px;");
                        console.log("%c[1] 網址參數解析:", "color: #fbbf24; font-weight: bold;", {
                            "卡片ID (id)": cardIdParam,
                            "模板ID (template)": templateParam,
                            "收件人 (to/name)": urlParams.get('to') || urlParams.get('name'),
                            "預覽模式 (preview)": isPreviewMode
                        });

                        // 1. 本地優先：優先從工坊 LocalStorage 陣列中尋找（0ms 秒開，支援尚未發布到雲端的本地草稿）
                        if (cardIdParam && loadedCards && loadedCards.length > 0) {
                            targetCard = loadedCards.find(c => c.id === cardIdParam) || null;
                            if (targetCard) console.log("%c[2] 命中本地 LocalStorage 畫廊卡片:", "color: #4ade80;", targetCard);
                        }

                        // 2. 次級快取：檢查單卡持久化快取 (cardforge_cache_${id})
                        if (!targetCard && cardIdParam) {
                            try {
                                const raw = localStorage.getItem('cardforge_cache_' + cardIdParam);
                                if (raw) {
                                    targetCard = JSON.parse(raw);
                                    console.log("%c[2] 命中單卡快取 (cardforge_cache):", "color: #4ade80;", targetCard);
                                }
                            } catch (e) {}
                        }

                        // 3. 雲端 SSOT 查詢（若本地完全找不到該卡，或非本地預覽模式時向 GAS 查詢最新版本）
                        if (!targetCard && cardIdParam && window.GasClient) {
                            console.log("%c[3] 本地無此卡，正在向 Google 雲端總帳發起查詢... (ID: " + cardIdParam + ")", "color: #38bdf8;");
                            console.log("   🔗 雲端請求端點:", window.CardForgeConfig?.GAS_API_URL);
                            try {
                                targetCard = await window.GasClient.getCard(cardIdParam, (updatedCard) => {
                                    if (updatedCard) {
                                        console.log("%c[3-SWR] 雲端背景異步更新完成:", "color: #a855f7;", updatedCard);
                                        setCurrentCard(updatedCard);
                                        if (updatedCard.templateId && !templateParam) {
                                            setActiveTemplateId(updatedCard.templateId);
                                        }
                                    }
                                });
                                if (targetCard) {
                                    console.log("%c[3] 🎉 雲端查詢成功！獲取到卡片:", "color: #4ade80; font-weight: bold;", targetCard);
                                } else {
                                    console.warn("%c[3] ⚠️ 雲端查詢未獲取到資料 (targetCard 為 null)", "color: #f87171;");
                                }
                            } catch (gasErr) {
                                console.error("%c[3] ❌ 雲端查詢拋出異常:", "color: #ef4444;", gasErr);
                            }
                        }

                        // 4. 若仍未找到且存在示範卡片，以第一張卡片保底
                        if (!targetCard) {
                            targetCard = (loadedCards && loadedCards.length > 0) ? loadedCards[0] : null;
                            console.warn("%c[4] 🚨 觸發【示範卡片保底機制】！原因：本地與雲端均未找到此卡", "color: #fb923c; font-weight: bold; background: #431407; padding: 2px 6px; border-radius: 4px;");
                            console.log("   👉 當前保底卡片:", targetCard?.name || targetCard?.title, targetCard);
                        } else {
                            console.log("%c[4] ✅ 成功鎖定目標卡片 (未觸發保底):", "color: #4ade80; font-weight: bold;", targetCard.title);
                        }

                        // 5. 🎯 專屬朋友稱謂自適應解析 (URL Parameter ?to=... 或 ?name=...)
                        if (targetCard) {
                            const recipientParam = urlParams.get('to') || urlParams.get('name');
                            if (recipientParam && recipientParam.trim()) {
                                const cleanParam = recipientParam.trim().slice(0, 40); // 40 字元防溢出邊界防禦
                                const baseRecipient = targetCard.recipient || '親愛的朋友：';
                                let newRecipient = '';
                                
                                // 判斷傳入參數是否已經是完整的禮貌稱謂 (例如: "Dear Danny," 或 "尊敬的 王總：" 或 結尾有標點)
                                const hasSalutationPrefix = /^(Dear|尊敬的|親愛的|致)\s*/i.test(cleanParam);
                                const hasTrailingPunct = /[：:，,！!]$/.test(cleanParam);

                                if (hasSalutationPrefix || hasTrailingPunct) {
                                    newRecipient = cleanParam;
                                } else if (baseRecipient.includes('{name}')) {
                                    newRecipient = baseRecipient.replace(/\{name\}/g, cleanParam);
                                } else if (baseRecipient.includes('朋友')) {
                                    newRecipient = baseRecipient.replace('朋友', cleanParam);
                                } else if (baseRecipient.startsWith('Dear') || /^[a-zA-Z]/.test(cleanParam)) {
                                    newRecipient = `Dear ${cleanParam},`;
                                } else if (baseRecipient.startsWith('尊敬的')) {
                                    newRecipient = `尊敬的 ${cleanParam}：`;
                                } else if (baseRecipient.startsWith('致')) {
                                    newRecipient = `致 ${cleanParam}：`;
                                } else {
                                    newRecipient = `親愛的 ${cleanParam}：`;
                                }

                                targetCard = {
                                    ...targetCard,
                                    recipient: newRecipient
                                };
                                console.log("%c[5] 稱謂計算完成:", "color: #38bdf8;", newRecipient);
                            }
                        }

                        setCurrentCard(targetCard);
                        const effectiveTemplateId = templateParam || (targetCard ? targetCard.templateId : 'mothers-day');
                        setActiveTemplateId(effectiveTemplateId);
                        console.log("%c[6] 最終渲染模板 (Template ID):", "color: #fbbf24; font-weight: bold;", effectiveTemplateId);
                        console.groupEnd();

                    } catch (err) {
                        console.error('Failed to init card player data:', err);
                    }
                }
                initData();
            }, []);

            // 同步主題 CSS 樣式類別至 body
            React.useEffect(() => {
                if (!activeTemplateId || templates.length === 0) return;
                const curTpl = templates.find(t => t.id === activeTemplateId);
                if (curTpl && curTpl.theme) {
                    const body = document.getElementById('app-body');
                    body.className = curTpl.theme.styleClass || '';
                }
            }, [activeTemplateId, templates]);

            const handleSwitchTemplate = (tplId) => {
                setActiveTemplateId(tplId);
                const url = new URL(window.location);
                url.searchParams.set('template', tplId);
                window.history.replaceState({}, '', url);
            };

            const handleStart = () => {
                setIsStarted(true);
                try {
                    const el = document.documentElement;
                    if (el.requestFullscreen) {
                        el.requestFullscreen().catch(() => {});
                    } else if (el.webkitRequestFullscreen) {
                        el.webkitRequestFullscreen().catch(() => {});
                    }
                } catch (e) {}

                if (audioRef.current) {
                    audioRef.current.volume = 0.55;
                    audioRef.current.play().catch(e => {
                        console.log('Audio autoplay blocked or waiting for user interaction:', e);
                    });
                }
            };

            // 雙向鐵壁同步：以 audio 實體 DOM 的 paused 狀態為最高真理
            const toggleAudio = () => {
                const audio = audioRef.current;
                if (!audio) return;
                if (!audio.paused) {
                    audio.pause();
                } else {
                    audio.play().catch(e => console.log('Audio play failed:', e));
                }
            };

            if (!currentCard || templates.length === 0) {
                return (
                    <div className="flex h-screen items-center justify-center text-zinc-400">
                        <i className="fa-solid fa-spinner fa-spin text-2xl mr-3"></i>
                        <span>載入專屬賀卡中...</span>
                    </div>
                );
            }

            const activeTemplate = templates.find(t => t.id === activeTemplateId) || templates[0];
            const musicUrl = (currentCard.media && currentCard.media.customMusic) 
                ? currentCard.media.customMusic 
                : (activeTemplate.defaultMusic || 'assets/audio/In Love With You.mp3');

            return (
                <div className="relative w-screen h-screen overflow-hidden flex items-center justify-center bg-black" style={{ height: '100dvh' }}>
                    {/* 🎵 音訊 DOM 節點常駐頂層，掛載原生事件即時反向同步 React isPlayingAudio 狀態 */}
                    <audio 
                        ref={audioRef} 
                        src={musicUrl} 
                        loop 
                        preload="auto"
                        onPlay={() => setIsPlayingAudio(true)}
                        onPause={() => setIsPlayingAudio(false)}
                    />

                    {!isStarted ? (
                        <WelcomeGate 
                            card={currentCard} 
                            template={activeTemplate} 
                            onStart={handleStart} 
                        />
                    ) : (
                        <React.Fragment>
                            {/* 全景背景氛圍層 (若有特效粒子，鋪滿整個 100vw/100vh 視窗) */}
                            <div className="absolute inset-0 pointer-events-none z-0 overflow-hidden">
                                {window.ParticleEngine && (
                                    <ParticleEngine effect={activeTemplate.effects || {}} />
                                )}
                            </div>

                            <AudioControls 
                                isPlayingAudio={isPlayingAudio}
                                onToggleAudio={toggleAudio}
                            />

                            {/* 🎬 核心卡片全景渲染舞台 */}
                            <div className="w-full h-full z-10 relative">
                                <CardEngine 
                                    card={currentCard} 
                                    template={activeTemplate} 
                                />
                            </div>
                        </React.Fragment>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CardPlayerApp />);
    </script>
</body>
</html>
