<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Greeting Card - CardForge</title>
    
    <!-- Fonts & Tailwind -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Jost:wght@200;300;400;500;600&family=Noto+Serif+TC:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    
    <!-- Three.js (For 3D Particle Planet & Hologram Effects) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- React & Babel -->
    <script src="https://resource.trickle.so/vendor_lib/unpkg/react@18/umd/react.production.min.js"></script>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/@babel/standalone/babel.min.js"></script>

    <!-- Custom Styles -->
    <link href="styles/animations.css" rel="stylesheet">
    <link href="styles/templates.css" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: 'Jost', system-ui, sans-serif;
            width: 100%;
            height: 100%;
            min-height: 100dvh;
            overflow: hidden;
            position: fixed;
        }

        /* Floating Theme Switcher Badge (ONLY visible when ?preview=1 or in debug) */
        .floating-switcher {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 50;
            background: rgba(15, 17, 23, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 9999px;
            padding: 0.35rem 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            transition: opacity 0.3s;
        }

        /* Swatch button for switching themes in preview */
        .swatch-btn {
            width: 18px;
            height: 18px;
            border-radius: 9999px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .swatch-btn:hover {
            transform: scale(1.2);
        }
        .swatch-btn.active {
            box-shadow: 0 0 0 2px #fff, 0 0 8px currentColor;
            transform: scale(1.15);
        }

        /* Recipient Discreet Audio Pill */
        .audio-pill-btn {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 50;
            width: 36px;
            height: 36px;
            border-radius: 9999px;
            background: rgba(15, 17, 23, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .audio-pill-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            transform: scale(1.05);
        }
    </style>
</head>
<body id="app-body">
    <div id="root"></div>

    <!-- Configuration & Pure JS (原生載入無 CORS 限制) -->
    <script src="core/BackdropShader.js"></script>
    <script src="js/config.js"></script>
    <script src="js/gas_client.js"></script>

    <!-- 
      重要說明：
      在 file:/// 協議下，Babel 無法透過 XHR 讀取外部 JSX 檔案 (會被 Chrome CORS 阻擋)。
      因此將 React JSX 組件集中內聯，保證 100% 零伺服器本地雙擊秒開！
    -->
    <script type="text/babel">
        // =========================================================================
        // 1. PARTICLE ENGINE (3D & Canvas 粒子引擎)
        // =========================================================================
        function ParticleEngine({ effect = {} }) {
            const canvasRef = React.useRef(null);
            const effectType = effect.particleType || 'rising-stardust';
            const primaryColor = effect.color || '#c9a96e';

            React.useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                if (!ctx) return;

                let animId = null;
                let width = (canvas.width = window.innerWidth);
                let height = (canvas.height = window.innerHeight);

                const handleResize = () => {
                    width = canvas.width = window.innerWidth;
                    height = canvas.height = window.innerHeight;
                };
                window.addEventListener('resize', handleResize);

                // 1. METEOR SHOWER
                let meteors = [];
                function createMeteor() {
                    return {
                        x: Math.random() * width + 200,
                        y: Math.random() * -100,
                        len: Math.random() * 90 + 70,
                        speed: Math.random() * 10 + 12,
                        size: Math.random() * 1.8 + 1.2,
                        opacity: Math.random() * 0.7 + 0.3
                    };
                }
                for (let i = 0; i < 6; i++) meteors.push(createMeteor());

                // 2. RISING STARDUST
                let stardust = [];
                const dustCount = effect.particleDensity ? effect.particleDensity * 2 : 60;
                for (let i = 0; i < dustCount; i++) {
                    stardust.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        radius: Math.random() * 2.5 + 0.8,
                        speed: Math.random() * 0.8 + 0.4,
                        wobbleSpeed: Math.random() * 0.02 + 0.01,
                        wobbleAmp: Math.random() * 30 + 10,
                        opacity: Math.random() * 0.7 + 0.25,
                        phase: Math.random() * Math.PI * 2
                    });
                }

                // 3. BLACK HOLE VORTEX
                let vortexStars = [];
                for (let i = 0; i < 150; i++) {
                    vortexStars.push({
                        angle: Math.random() * Math.PI * 2,
                        radius: Math.random() * (Math.min(width, height) * 0.48) + 30,
                        speed: (Math.random() * 0.006 + 0.003),
                        size: Math.random() * 2 + 1,
                        opacity: Math.random() * 0.8 + 0.2
                    });
                }

                // 4. SAKURA PETALS
                let petals = [];
                for (let i = 0; i < 35; i++) {
                    petals.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        size: Math.random() * 8 + 7,
                        speedY: Math.random() * 1.2 + 0.8,
                        speedX: Math.random() * 0.8 - 0.4,
                        flip: Math.random() * Math.PI,
                        flipSpeed: Math.random() * 0.03 + 0.01,
                        rotation: Math.random() * 360,
                        opacity: Math.random() * 0.4 + 0.55
                    });
                }

                // 5. ORBITAL SATELLITES
                let satellites = [];
                for (let i = 0; i < 3; i++) {
                    satellites.push({
                        angle: (i * Math.PI * 2) / 3,
                        rx: width * 0.38,
                        ry: height * 0.16,
                        speed: 0.008 + i * 0.003,
                        tilt: -0.25 + i * 0.2,
                        size: 3.5 + i
                    });
                }

                function loop() {
                    ctx.clearRect(0, 0, width, height);

                    if (effectType === 'meteor-shower') {
                        for (let m of meteors) {
                            m.x -= m.speed;
                            m.y += m.speed * 0.75;
                            const grad = ctx.createLinearGradient(m.x, m.y, m.x + m.len, m.y - m.len * 0.75);
                            grad.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
                            grad.addColorStop(0.2, primaryColor);
                            grad.addColorStop(1, 'transparent');
                            ctx.strokeStyle = grad;
                            ctx.lineWidth = m.size;
                            ctx.beginPath();
                            ctx.moveTo(m.x, m.y);
                            ctx.lineTo(m.x + m.len, m.y - m.len * 0.75);
                            ctx.stroke();

                            ctx.fillStyle = '#ffffff';
                            ctx.beginPath();
                            ctx.arc(m.x, m.y, m.size * 1.3, 0, Math.PI * 2);
                            ctx.fill();

                            if (m.x < -100 || m.y > height + 100) Object.assign(m, createMeteor());
                        }
                    } else if (effectType === 'rising-stardust') {
                        for (let s of stardust) {
                            s.y -= s.speed;
                            s.phase += s.wobbleSpeed;
                            const curX = s.x + Math.sin(s.phase) * s.wobbleAmp;
                            const grad = ctx.createRadialGradient(curX, s.y, 0, curX, s.y, s.radius * 3.5);
                            grad.addColorStop(0, '#ffffff');
                            grad.addColorStop(0.4, primaryColor);
                            grad.addColorStop(1, 'transparent');
                            ctx.fillStyle = grad;
                            ctx.beginPath();
                            ctx.arc(curX, s.y, s.radius * 3, 0, Math.PI * 2);
                            ctx.fill();
                            if (s.y < -20) {
                                s.y = height + 20;
                                s.x = Math.random() * width;
                            }
                        }
                    } else if (effectType === 'blackhole-vortex') {
                        const cx = width / 2;
                        const cy = height / 2;
                        for (let v of vortexStars) {
                            v.angle += v.speed * (350 / (v.radius + 50));
                            v.radius -= 0.18;
                            const px = cx + Math.cos(v.angle) * v.radius * 1.3;
                            const py = cy + Math.sin(v.angle) * v.radius * 0.75;
                            ctx.fillStyle = primaryColor;
                            ctx.globalAlpha = v.opacity;
                            ctx.beginPath();
                            ctx.arc(px, py, v.size, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.globalAlpha = 1.0;
                            if (v.radius < 15) {
                                v.radius = Math.min(width, height) * 0.45;
                                v.angle = Math.random() * Math.PI * 2;
                            }
                        }
                    } else if (effectType === 'sakura-canvas') {
                        for (let p of petals) {
                            p.y += p.speedY;
                            p.x += Math.sin(p.flip) * 0.8;
                            p.flip += p.flipSpeed;
                            ctx.save();
                            ctx.translate(p.x, p.y);
                            ctx.rotate((p.rotation * Math.PI) / 180);
                            ctx.scale(Math.cos(p.flip), 1);
                            ctx.fillStyle = 'rgba(251, 182, 206, ' + p.opacity + ')';
                            ctx.beginPath();
                            ctx.moveTo(0, 0);
                            ctx.bezierCurveTo(-p.size / 2, -p.size / 2, -p.size, p.size / 3, 0, p.size);
                            ctx.bezierCurveTo(p.size, p.size / 3, p.size / 2, -p.size / 2, 0, 0);
                            ctx.fill();
                            ctx.restore();
                            if (p.y > height + 30) {
                                p.y = -30;
                                p.x = Math.random() * width;
                            }
                        }
                    } else if (effectType === 'orbital-satellites') {
                        const cx = width / 2;
                        const cy = height / 2;
                        for (let sat of satellites) {
                            sat.angle += sat.speed;
                            const cos = Math.cos(sat.angle);
                            const sin = Math.sin(sat.angle);
                            const x = cx + (cos * sat.rx * Math.cos(sat.tilt) - sin * sat.ry * Math.sin(sat.tilt));
                            const y = cy + (cos * sat.rx * Math.sin(sat.tilt) + sin * sat.ry * Math.cos(sat.tilt));
                            ctx.strokeStyle = 'rgba(201, 169, 110, 0.12)';
                            ctx.lineWidth = 1;
                            ctx.beginPath();
                            ctx.ellipse(cx, cy, sat.rx, sat.ry, sat.tilt, 0, Math.PI * 2);
                            ctx.stroke();

                            const grad = ctx.createRadialGradient(x, y, 0, x, y, sat.size * 3);
                            grad.addColorStop(0, '#ffffff');
                            grad.addColorStop(0.5, primaryColor);
                            grad.addColorStop(1, 'transparent');
                            ctx.fillStyle = grad;
                            ctx.beginPath();
                            ctx.arc(x, y, sat.size * 2.5, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                    animId = requestAnimationFrame(loop);
                }

                animId = requestAnimationFrame(loop);

                return () => {
                    cancelAnimationFrame(animId);
                    window.removeEventListener('resize', handleResize);
                };
            }, [effectType, primaryColor, effect.particleDensity]);

            if (effectType === 'none') return null;

            return (
                <canvas
                    ref={canvasRef}
                    className="absolute inset-0 pointer-events-none z-10 w-full h-full"
                />
            );
        }
        window.ParticleEngine = ParticleEngine;

        // =========================================================================
        // 2. CARD ENGINE (渲染舞台)
        // =========================================================================
        function CardEngine({ card, template }) {
            const [currentIndex, setCurrentIndex] = React.useState(0);
            const [isPaused, setIsPaused] = React.useState(false);

            const photos = (card && card.media && card.media.photos && card.media.photos.length > 0)
                ? card.media.photos
                : [];

            const hasPhotos = photos.length > 0;
            const theme = (template && template.theme) || {};
            const effect = (template && template.effects) || {};
            const layout = (card && card.layout) || (template && template.layout) || 'star-wars-crawl';
            const bgShader = (template && template.bgShader) || 'none';
            const bgBrightness = (template && template.bgDimmer) || 0.95;
            const crawlSpeed = `${(template && template.crawlSpeed) || 44}s`;

            React.useEffect(() => {
                if (window.BackdropShader) {
                    window.BackdropShader.init("bg-shader-canvas", bgShader);
                }
                return () => {
                    if (window.BackdropShader) window.BackdropShader.stop();
                };
            }, [bgShader]);

            React.useEffect(() => {
                if (photos.length <= 1) return;
                const interval = setInterval(() => {
                    setCurrentIndex(prev => (prev + 1) % photos.length);
                }, 5000);
                return () => clearInterval(interval);
            }, [photos.length]);

            if (!card) return null;

            return (
                <div 
                    className="absolute inset-0 w-full h-full overflow-hidden select-none"
                    style={{ backgroundColor: theme.bgColor || '#09090b' }}
                >
                    <canvas 
                        id="bg-shader-canvas" 
                        className="absolute inset-0 w-full h-full pointer-events-none z-0" 
                    />

                    {hasPhotos && (
                        <div className="absolute inset-0 w-full h-full pointer-events-none z-0 overflow-hidden">
                            {photos.map((url, idx) => {
                                const isActive = idx === currentIndex;
                                return (
                                    <div
                                        key={url + idx}
                                        className={`absolute inset-0 w-full h-full bg-cover bg-center transition-opacity duration-1000 ease-in-out ${isActive ? 'opacity-100 ken-burns-bg' : 'opacity-0'}`}
                                        style={{
                                            backgroundImage: `url('${url}')`,
                                            filter: `brightness(${bgBrightness}) saturate(1.05)`,
                                            mixBlendMode: bgShader !== 'none' ? 'screen' : 'normal',
                                            opacity: isActive ? (bgShader !== 'none' ? 0.65 : 1) : 0
                                        }}
                                    />
                                );
                            })}
                        </div>
                    )}

                    <div 
                        className="absolute inset-0 pointer-events-none z-10"
                        style={{
                            background: 'radial-gradient(circle at center, rgba(0,0,0,0.02) 0%, rgba(0,0,0,0.35) 100%)'
                        }}
                    />

                    <ParticleEngine effect={{
                        particleType: effect.particleType || 'rising-stardust',
                        color: theme.primaryColor || '#c9a96e',
                        particleDensity: effect.particleDensity || 25
                    }} />

                    <header className="absolute top-0 left-0 right-0 z-30 pt-6 pb-4 text-center px-4 pointer-events-none bg-gradient-to-b from-black/75 via-black/20 to-transparent">
                        <h1 
                            className="text-3xl md:text-5xl font-light tracking-wide clean-title-glow text-white"
                            style={{ 
                                fontFamily: theme.fontFamily || 'serif',
                                '--title-color': theme.titleColor || '#ffffff',
                                '--title-glow': theme.primaryColor || '#c9a96e'
                            }}
                        >
                            {card.title}
                        </h1>
                    </header>

                    {layout === 'star-wars-crawl' && (
                        <div 
                            className="absolute inset-x-0 top-24 bottom-6 z-20 flex justify-center items-start overflow-hidden cursor-pointer crawl-mask-container"
                            onClick={() => setIsPaused(!isPaused)}
                        >
                            <div 
                                className={`w-full max-w-2xl px-6 md:px-8 text-center text-white anim-star-wars-crawl ${isPaused ? 'is-paused' : ''}`}
                                style={{ 
                                    fontFamily: theme.fontFamily || 'serif',
                                    '--crawl-duration': crawlSpeed
                                }}
                            >
                                <div className="w-full py-8 px-4 space-y-8">
                                    {card.recipient && (
                                        <div 
                                            className="text-2xl md:text-3xl font-semibold tracking-wider clean-text-shadow"
                                            style={{ color: theme.primaryColor || '#fbcfe8' }}
                                        >
                                            {card.recipient}
                                        </div>
                                    )}

                                    <div className="space-y-6 text-lg md:text-2xl leading-relaxed font-light tracking-wide clean-text-shadow text-white/95">
                                        {(card.paragraphs || []).map((p, idx) => (
                                            <p key={idx} className="whitespace-pre-line">
                                                {p}
                                            </p>
                                        ))}
                                    </div>

                                    {card.sender && (
                                        <div className="pt-6 text-right">
                                            <p 
                                                className="text-xl md:text-2xl italic font-serif clean-text-shadow whitespace-pre-line font-medium"
                                                style={{ color: theme.primaryColor || '#fbcfe8' }}
                                            >
                                                {card.sender}
                                            </p>
                                        </div>
                                    )}

                                    {card.cta && card.cta.length > 0 && (
                                        <div className="pt-8 flex flex-wrap gap-4 justify-center pointer-events-auto">
                                            {card.cta.map((btn, idx) => (
                                                <a
                                                    key={idx}
                                                    href={btn.url}
                                                    target="_blank"
                                                    rel="noopener noreferrer"
                                                    className="inline-flex items-center gap-2 px-6 py-2.5 rounded-full text-sm font-semibold tracking-wider uppercase border border-white text-white bg-black/40 hover:bg-black/70 backdrop-blur-md transition-all duration-300 hover:scale-105 shadow-lg"
                                                    style={{ borderColor: theme.primaryColor }}
                                                >
                                                    {btn.icon && <i className={`fa-solid ${btn.icon}`}></i>}
                                                    <span>{btn.label}</span>
                                                </a>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {layout === 'boxed-card' && (
                        <div className="absolute inset-x-0 top-24 bottom-6 z-20 overflow-y-auto custom-scrollbar flex justify-center items-center p-4 md:p-6">
                            <div 
                                className="max-w-2xl w-full rounded-2xl p-6 md:p-8 backdrop-blur-xl border border-white/15 shadow-2xl space-y-6"
                                style={{ 
                                    background: 'rgba(15, 17, 23, 0.85)',
                                    fontFamily: theme.fontFamily || 'serif'
                                }}
                            >
                                {hasPhotos && (
                                    <div className="relative aspect-[16/9] w-full rounded-xl overflow-hidden shadow-lg border border-white/10">
                                        <img
                                            src={photos[currentIndex]}
                                            alt="Slide"
                                            className="w-full h-full object-cover transition-transform duration-700 hover:scale-105"
                                        />
                                        <div className="absolute bottom-2 right-2 px-2.5 py-0.5 rounded-full bg-black/60 backdrop-blur-md text-[11px] text-white/80">
                                            {currentIndex + 1} / {photos.length}
                                        </div>
                                    </div>
                                )}

                                {card.recipient && (
                                    <h2 
                                        className="text-xl md:text-2xl font-semibold tracking-wider border-b border-white/10 pb-3"
                                        style={{ color: theme.primaryColor || '#c9a96e' }}
                                    >
                                        {card.recipient}
                                    </h2>
                                )}

                                <div className="space-y-4 text-base md:text-lg leading-relaxed text-zinc-200 font-light">
                                    {(card.paragraphs || []).map((p, idx) => (
                                        <p key={idx} className="whitespace-pre-line">
                                            {p}
                                        </p>
                                    ))}
                                </div>

                                {card.sender && (
                                    <div className="pt-4 border-t border-white/10 text-right">
                                        <p 
                                            className="text-lg md:text-xl italic font-serif whitespace-pre-line font-medium"
                                            style={{ color: theme.primaryColor || '#c9a96e' }}
                                        >
                                            {card.sender}
                                        </p>
                                    </div>
                                )}

                                {card.cta && card.cta.length > 0 && (
                                    <div className="pt-4 flex flex-wrap gap-3 justify-center">
                                        {card.cta.map((btn, idx) => (
                                            <a
                                                key={idx}
                                                href={btn.url}
                                                target="_blank"
                                                rel="noopener noreferrer"
                                                className="inline-flex items-center gap-2 px-6 py-2.5 rounded-full text-sm font-semibold tracking-wider uppercase border border-current text-white bg-white/10 hover:bg-white/25 transition-all shadow-md"
                                                style={{ color: theme.primaryColor }}
                                            >
                                                {btn.icon && <i className={`fa-solid ${btn.icon}`}></i>}
                                                <span>{btn.label}</span>
                                            </a>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }
        window.CardEngine = CardEngine;

        // =========================================================================
        // 3. CARD PLAYER APP (受眾端播放器)
        // =========================================================================
        function CardPlayerApp() {
            const [cards, setCards] = React.useState([]);
            const [templates, setTemplates] = React.useState([]);
            const [currentCard, setCurrentCard] = React.useState(null);
            const [activeTemplateId, setActiveTemplateId] = React.useState(null);
            const [isStarted, setIsStarted] = React.useState(false);
            const [isPlayingAudio, setIsPlayingAudio] = React.useState(false);
            const [isPreviewMode, setIsPreviewMode] = React.useState(false);
            const audioRef = React.useRef(null);

            // Load data with Cloud SSOT + SWR & Local Fallback
            React.useEffect(() => {
                async function initData() {
                    try {
                        let loadedTemplates = [];
                        const localTpls = localStorage.getItem('cardforge_templates');
                        if (localTpls) {
                            try { loadedTemplates = JSON.parse(localTpls); } catch (e) {}
                        }
                        if (!loadedTemplates || loadedTemplates.length === 0) {
                            try {
                                const resT = await fetch('data/templates.json');
                                if (resT.ok) loadedTemplates = await resT.json();
                            } catch (e) {
                                // 離線保底模板
                                loadedTemplates = [
                                    {
                                        id: 'mothers-day',
                                        name: '典雅溫情 · 櫻花信箋',
                                        layout: 'star-wars-crawl',
                                        bgShader: 'none',
                                        crawlSpeed: 44,
                                        theme: { primaryColor: '#f472b6', bgColor: '#14050b' },
                                        effects: { particleType: 'sakura-canvas', particleDensity: 30 }
                                    }
                                ];
                            }
                        }
                        setTemplates(loadedTemplates || []);

                        const urlParams = new URLSearchParams(window.location.search);
                        const cardIdParam = urlParams.get('id') || urlParams.get('card');
                        const templateParam = urlParams.get('template');
                        const previewParam = urlParams.get('preview');

                        setIsPreviewMode(previewParam === '1' || previewParam === 'true');

                        let targetCard = null;
                        if (cardIdParam && window.GasClient) {
                            targetCard = await window.GasClient.getCard(cardIdParam, (updatedCard) => {
                                if (updatedCard) {
                                    setCurrentCard(updatedCard);
                                    if (updatedCard.templateId && !templateParam) {
                                        setActiveTemplateId(updatedCard.templateId);
                                    }
                                }
                            });
                        }

                        if (!targetCard) {
                            let loadedCards = [];
                            const localCards = localStorage.getItem('cardforge_cards');
                            if (localCards) {
                                try { loadedCards = JSON.parse(localCards); } catch (e) {}
                            }
                            if (!loadedCards || loadedCards.length === 0) {
                                try {
                                    const resC = await fetch('data/cards.json');
                                    if (resC.ok) loadedCards = await resC.json();
                                } catch (e) {
                                    // 離線保底卡片
                                    loadedCards = [
                                        {
                                            id: 'card-mothers-day',
                                            templateId: 'mothers-day',
                                            title: "Happy Mother's Day",
                                            recipient: 'Dear My Love,',
                                            paragraphs: [
                                                'On this special day, I just want to say thank you.',
                                                'Thank you for staying by my side all these years, for taking care of me with so much love and patience.',
                                                'Wishing you peace, love, and all the happiness you deserve.'
                                            ],
                                            sender: 'With all my love,\nChen Hung Yu',
                                            media: { bgMode: 'slideshow', photos: [] }
                                        }
                                    ];
                                }
                            }
                            setCards(loadedCards || []);

                            targetCard = (loadedCards && loadedCards.length > 0)
                                ? (loadedCards.find(c => c.id === cardIdParam) || loadedCards[0])
                                : null;
                        }

                        setCurrentCard(targetCard);

                        const effectiveTemplateId = templateParam || (targetCard ? targetCard.templateId : 'mothers-day');
                        setActiveTemplateId(effectiveTemplateId);

                    } catch (err) {
                        console.error('Failed to init card player data:', err);
                    }
                }
                initData();
            }, []);

            React.useEffect(() => {
                if (!activeTemplateId || templates.length === 0) return;
                const curTpl = templates.find(t => t.id === activeTemplateId);
                if (curTpl && curTpl.theme) {
                    const body = document.getElementById('app-body');
                    body.className = curTpl.theme.styleClass || '';
                }
            }, [activeTemplateId, templates]);

            const handleSwitchTemplate = (tplId) => {
                setActiveTemplateId(tplId);
                const url = new URL(window.location);
                url.searchParams.set('template', tplId);
                window.history.replaceState({}, '', url);
            };

            const handleStart = () => {
                setIsStarted(true);
                try {
                    const el = document.documentElement;
                    if (el.requestFullscreen) {
                        el.requestFullscreen().catch(() => {});
                    } else if (el.webkitRequestFullscreen) {
                        el.webkitRequestFullscreen().catch(() => {});
                    }
                } catch (e) {}

                if (audioRef.current) {
                    audioRef.current.volume = 0.55;
                    audioRef.current.play().then(() => {
                        setIsPlayingAudio(true);
                    }).catch(e => {
                        console.log('Audio playback initiated:', e);
                        setIsPlayingAudio(true);
                    });
                }
            };

            const toggleAudio = () => {
                if (!audioRef.current) return;
                if (isPlayingAudio) {
                    audioRef.current.pause();
                    setIsPlayingAudio(false);
                } else {
                    audioRef.current.play();
                    setIsPlayingAudio(true);
                }
            };

            if (!currentCard || templates.length === 0) {
                return (
                    <div className="flex h-screen items-center justify-center text-zinc-400">
                        <i className="fa-solid fa-spinner fa-spin text-2xl mr-3"></i>
                        <span>載入專屬賀卡中...</span>
                    </div>
                );
            }

            const activeTemplate = templates.find(t => t.id === activeTemplateId) || templates[0];
            const musicUrl = (currentCard.media && currentCard.media.customMusic) 
                ? currentCard.media.customMusic 
                : (activeTemplate.defaultMusic || 'assets/audio/In Love With You.mp3');

            if (!isStarted) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center relative z-20 bg-black">
                        <ParticleEngine effect={activeTemplate.effects} />
                        
                        <div className="max-w-md w-full p-8 md:p-10 rounded-2xl bg-zinc-900/80 backdrop-blur-2xl border border-white/15 shadow-2xl space-y-6">
                            <h1 className="text-3xl md:text-4xl font-light text-white" style={{ fontFamily: activeTemplate.theme?.fontFamily }}>
                                {currentCard.title || '一份特別的祝福'}
                            </h1>
                            <p className="text-sm text-zinc-400">
                                {currentCard.recipient ? `致 ${currentCard.recipient}` : '請點擊開啟專屬沉浸式卡片'}
                            </p>
                            
                            <button
                                onClick={handleStart}
                                className="w-full py-3.5 px-6 rounded-xl font-medium tracking-wide transition-all duration-300 transform active:scale-95 shadow-lg flex items-center justify-center gap-2 group"
                                style={{
                                    backgroundColor: activeTemplate.theme?.primaryColor || '#c9a96e',
                                    color: activeTemplate.theme?.bgColor || '#09090b'
                                }}
                            >
                                <i className="fa-solid fa-envelope-open text-sm group-hover:scale-110 transition-transform"></i>
                                <span>開啟賀卡與音樂體驗</span>
                            </button>
                            
                            <div className="text-[11px] text-zinc-500 flex items-center justify-center gap-1.5 pt-2">
                                <i className="fa-solid fa-headphones text-[10px]"></i>
                                <span>佩戴耳機或開啟聲音體驗最佳</span>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="relative w-screen h-screen overflow-hidden" style={{ height: '100dvh' }}>
                    <audio ref={audioRef} src={musicUrl} loop autoPlay />

                    {isPreviewMode ? (
                        <div className="floating-switcher">
                            <span className="text-xs text-zinc-300 font-medium hidden sm:inline">切換風格:</span>
                            <div className="flex items-center gap-2">
                                {templates.map(t => (
                                    <button
                                        key={t.id}
                                        title={`切換為「${t.name}」風格`}
                                        onClick={() => handleSwitchTemplate(t.id)}
                                        className={`swatch-btn ${activeTemplateId === t.id ? 'active' : ''}`}
                                        style={{
                                            backgroundColor: t.theme?.primaryColor || '#ffffff',
                                            color: t.theme?.primaryColor || '#ffffff'
                                        }}
                                    />
                                ))}
                            </div>
                            <div className="h-4 w-px bg-white/20 mx-1"></div>
                            <button 
                                onClick={toggleAudio}
                                title={isPlayingAudio ? "暫停音樂" : "播放音樂"}
                                className="text-zinc-200 hover:text-white transition-colors text-sm"
                            >
                                <i className={`fa-solid ${isPlayingAudio ? 'fa-volume-high' : 'fa-volume-xmark'}`}></i>
                            </button>
                        </div>
                    ) : (
                        <button
                            onClick={toggleAudio}
                            title={isPlayingAudio ? "暫停音樂" : "播放音樂"}
                            className="audio-pill-btn"
                        >
                            <i className={`fa-solid ${isPlayingAudio ? 'fa-volume-high' : 'fa-volume-xmark'} text-xs`}></i>
                        </button>
                    )}

                    <CardEngine 
                        card={currentCard} 
                        template={activeTemplate} 
                    />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CardPlayerApp />);
    </script>
</body>
</html>
