<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Greeting Card - CardForge</title>
    
    <!-- 首頁智慧路由：有卡片參數導向 play.html，無參數直接進創作者工坊 workspace.html -->
    <script>
        (function() {
            var params = new URLSearchParams(window.location.search);
            var isRecipientView = params.has('card') || params.has('id') || params.has('preview');
            if (isRecipientView) {
                // 舊版帶參數卡片連結無縫平移至 play.html
                window.location.replace('play.html' + window.location.search);
            } else {
                // 無參數直接進入創作者大畫廊工坊
                window.location.replace('workspace.html');
            }
        })();
    </script>
    
    <!-- Favicon & PWA Icons (帶版本號強制破除瀏覽器頑固快取) -->
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=2">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
    <link rel="manifest" href="manifest.json?v=2">
    <meta name="theme-color" content="#000000">

    <!-- Open Graph / WhatsApp / LINE / Facebook 社群預覽封面 -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="CardForge Studio">
    <meta property="og:title" content="A Special Gift for You">
    <meta property="og:description" content="Warmest Wishes &amp; Best Regards.">
    <meta property="og:image" content="https://i.ibb.co/YFsSdsjg/share-cover-webp.webp">
    <meta property="og:image:secure_url" content="https://i.ibb.co/YFsSdsjg/share-cover-webp.webp">
    <meta property="og:image:type" content="image/webp">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="A Special Gift for You">
    <meta name="twitter:description" content="Warmest Wishes &amp; Best Regards.">
    <meta name="twitter:image" content="https://i.ibb.co/YFsSdsjg/share-cover-webp.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Jost:wght@200;300;400;500;600&family=Noto+Serif+TC:wght@300;400;600&family=Noto+Sans+TC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    
    <!-- Three.js (For 3D Particle Planet & Hologram Effects) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- React & Babel (官方高公信力 CDNJS，杜絕未知第三方域名連線逾時卡死) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

    <!-- Custom Styles -->
    <link href="styles/animations.css" rel="stylesheet">
    <link href="styles/templates.css" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: 'Jost', system-ui, sans-serif;
            width: 100%;
            height: 100%;
            min-height: 100dvh;
            overflow: hidden;
            position: fixed;
        }

        /* Recipient Discreet Audio Pill */
        .audio-pill-btn {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 50;
            width: 36px;
            height: 36px;
            border-radius: 9999px;
            background: rgba(15, 17, 23, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .audio-pill-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            transform: scale(1.05);
        }
    </style>
</head>
<body id="app-body">
    <div id="root"></div>

    <!-- Configuration & Pure JS (原生載入無 CORS 限制，附帶 Cache Buster 強制拉新) -->
    <script src="core/BackdropShader.js?v=2"></script>
    <script src="core/ParticleEngine.js?v=2"></script>
    <script src="js/constants.js?v=2"></script>
    <script src="js/config.js?v=2"></script>
    <script src="js/gas_client.js?v=2"></script>
    <script src="core/CardEngine.js?v=2"></script>
    <script src="js/workspace_store.js?v=2"></script>

    <!-- 
      重要說明：
      在 file:/// 協議下，Babel 無法透過 XHR 讀取外部 JSX 檔案 (會被 Chrome CORS 阻擋)。
      純 JS 模組 (CardEngine, ParticleEngine, constants, config, gas_client) 走原生 script 標籤載入，
      頂層 React 視圖路由維持內聯，保證 100% 模組化且零伺服器本機雙擊秒開！
    -->
    <script type="text/babel">
        // 引用外部已模組化的核心渲染舞台 (core/CardEngine.js)
        const CardEngine = window.CardEngine;

        // =========================================================================
        // 2. CHILD COMPONENTS (受眾端子組件)
        // =========================================================================
        
        // 開門封面遮罩 (方案 A：極簡深色微透玻璃 ＋ 聲波脈衝直覺解鎖按鈕)
        function WelcomeGate({ card, template, onStart, isReady = true }) {
            const primaryColor = template.theme?.primaryColor || '#c9a96e';
            const fontFamily = template.theme?.fontFamily || 'inherit';

            return (
                <div className="absolute inset-0 z-30 flex items-center justify-center p-4 select-none pointer-events-auto transition-opacity duration-700">
                    {/* 極簡微透毛玻璃卡片：僅展示卡片動態標題與收件人 */}
                    <div className="max-w-xs sm:max-w-sm w-full p-6 sm:p-8 rounded-3xl bg-zinc-950/60 backdrop-blur-xl border border-white/10 shadow-2xl flex flex-col items-center text-center space-y-6">
                        {/* 卡片標題 */}
                        {card.title && (
                            <h1 
                                className="text-2xl sm:text-3xl font-light text-white tracking-wide clean-title-glow leading-snug"
                                style={{ fontFamily: fontFamily }}
                            >
                                {card.title}
                            </h1>
                        )}

                        {/* 收件人姓名/稱謂 */}
                        {card.recipient && (
                            <p 
                                className="text-sm font-medium tracking-wider"
                                style={{ color: primaryColor, fontFamily: fontFamily }}
                            >
                                {card.recipient}
                            </p>
                        )}

                        {/* 🌟 極簡解鎖按鈕：未就緒純轉圈圈，就緒切換為播放鍵 */}
                        <div className="pt-2 flex flex-col items-center">
                            <button
                                type="button"
                                onClick={isReady ? onStart : undefined}
                                disabled={!isReady}
                                title={isReady ? "Play / Open" : "Loading..."}
                                aria-label={isReady ? "Play / Open" : "Loading..."}
                                className={`w-16 h-16 sm:w-18 sm:h-18 rounded-full flex items-center justify-center text-zinc-950 shadow-2xl transition-all duration-300 ${isReady ? 'active:scale-90 cursor-pointer pulse-soundwave-btn group' : 'cursor-wait opacity-90'}`}
                                style={{
                                    backgroundColor: primaryColor,
                                    color: template.theme?.bgColor || '#09090b'
                                }}
                            >
                                {isReady ? (
                                    <i className="fa-solid fa-play text-xl sm:text-2xl pl-1 group-hover:scale-110 transition-transform"></i>
                                ) : (
                                    <i className="fa-solid fa-circle-notch fa-spin text-xl sm:text-2xl"></i>
                                )}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // 音訊控制浮鈕 (受眾端極簡半透明藥丸鈕)
        function AudioControls({ isPlayingAudio, onToggleAudio }) {
            return (
                <button
                    onClick={onToggleAudio}
                    title={isPlayingAudio ? "暫停音樂" : "播放音樂"}
                    className="audio-pill-btn"
                >
                    <i className={`fa-solid ${isPlayingAudio ? 'fa-volume-high' : 'fa-volume-xmark'} text-xs`}></i>
                </button>
            );
        }

        // =========================================================================
        // 3. CARD PLAYER APP (受眾端播放器主入口)
        // =========================================================================
        function CardPlayerApp() {
            const [templates, setTemplates] = React.useState([]);
            const [currentCard, setCurrentCard] = React.useState(null);
            const [activeTemplateId, setActiveTemplateId] = React.useState(null);
            const [isStarted, setIsStarted] = React.useState(false);
            const [isPlayingAudio, setIsPlayingAudio] = React.useState(false);
            const [isPreviewMode, setIsPreviewMode] = React.useState(false);
            const [isReady, setIsReady] = React.useState(false);
            const audioRef = React.useRef(null);

            // 初始化卡片與模板數據 (精準單卡 + 單模板加載，物理固化 LocalStorage，零計時器)
            React.useEffect(() => {
                async function initData() {
                    try {
                        const urlParams = new URLSearchParams(window.location.search);
                        const cardIdParam = urlParams.get('id') || urlParams.get('card');
                        const templateParam = urlParams.get('template');
                        const previewParam = urlParams.get('preview');

                        setIsPreviewMode(previewParam === '1' || previewParam === 'true');

                        let targetCard = null;
                        let targetTemplate = null;

                        // 1. 本地快取秒查 (已造訪過者直接 0ms 呈現)
                        if (cardIdParam) {
                            try {
                                const rawCard = localStorage.getItem('cardforge_cache_' + cardIdParam);
                                if (rawCard) targetCard = JSON.parse(rawCard);
                                if (targetCard && targetCard.templateId) {
                                    const rawTpl = localStorage.getItem('cardforge_cache_tpl_' + targetCard.templateId);
                                    if (rawTpl) targetTemplate = JSON.parse(rawTpl);
                                }
                            } catch (e) {}

                            // 若本地已有完整快取，直接宣告 Ready
                            if (targetCard && targetTemplate) {
                                setCurrentCard(targetCard);
                                setTemplates([targetTemplate]);
                                setActiveTemplateId(targetTemplate.id);
                                setIsReady(true);
                            }
                        }

                        // 2. 雲端單點精準加載 (只取 1 卡 + 1 模板，零計時器，物理寫入 LocalStorage)
                        if (cardIdParam && window.GasClient) {
                            try {
                                const cloudCard = await window.GasClient.getCard(cardIdParam);
                                if (cloudCard) {
                                    targetCard = cloudCard;
                                    try {
                                        localStorage.setItem('cardforge_cache_' + cardIdParam, JSON.stringify(cloudCard));
                                    } catch (e) {}

                                    const tplId = templateParam || cloudCard.templateId || 'mid-autumn-moon';
                                    const cloudTpl = await window.GasClient.getTemplate(tplId);
                                    if (cloudTpl) {
                                        targetTemplate = cloudTpl;
                                        try {
                                            localStorage.setItem('cardforge_cache_tpl_' + tplId, JSON.stringify(cloudTpl));
                                        } catch (e) {}
                                    }
                                }
                            } catch (gasErr) {
                                console.warn('[CardPlayerApp] GAS 精準加載異常:', gasErr);
                            }
                        }

                        // 3. 本地無參數直接開啟 (預覽模式保底)
                        if (!cardIdParam) {
                            const { cards: loadedCards, templates: loadedTemplates } = await window.WorkspaceStore.loadInitialData();
                            targetCard = (loadedCards && loadedCards.length > 0) ? loadedCards[0] : null;
                            targetTemplate = (loadedTemplates && loadedTemplates.length > 0) ? loadedTemplates[0] : null;
                            setTemplates(loadedTemplates || []);
                            if (targetTemplate) setActiveTemplateId(targetTemplate.id);
                            setIsReady(true);
                        }

                        // 4. 朋友稱謂自適應解析 (?to=... 或 ?name=...)
                        if (targetCard) {
                            const recipientParam = urlParams.get('to') || urlParams.get('name');
                            if (recipientParam && recipientParam.trim()) {
                                const cleanParam = recipientParam.trim().slice(0, 40);
                                const baseRecipient = targetCard.recipient || '親愛的朋友：';
                                let newRecipient = '';
                                const hasSalutationPrefix = /^(Dear|尊敬的|親愛的|致)\s*/i.test(cleanParam);
                                const hasTrailingPunct = /[：:，,！!]$/.test(cleanParam);

                                if (hasSalutationPrefix || hasTrailingPunct) {
                                    newRecipient = cleanParam;
                                } else if (baseRecipient.includes('{name}')) {
                                    newRecipient = baseRecipient.replace(/\{name\}/g, cleanParam);
                                } else if (baseRecipient.includes('朋友')) {
                                    newRecipient = baseRecipient.replace('朋友', cleanParam);
                                } else if (baseRecipient.startsWith('Dear') || /^[a-zA-Z]/.test(cleanParam)) {
                                    newRecipient = `Dear ${cleanParam},`;
                                } else if (baseRecipient.startsWith('尊敬的')) {
                                    newRecipient = `尊敬的 ${cleanParam}：`;
                                } else if (baseRecipient.startsWith('致')) {
                                    newRecipient = `致 ${cleanParam}：`;
                                } else {
                                    newRecipient = `親愛的 ${cleanParam}：`;
                                }

                                targetCard = {
                                    ...targetCard,
                                    recipient: newRecipient
                                };
                            }
                        }

                        // 5. 注入狀態與解鎖
                        if (targetCard) setCurrentCard(targetCard);
                        if (targetTemplate) {
                            setTemplates([targetTemplate]);
                            setActiveTemplateId(targetTemplate.id);
                        }
                        if (targetCard && targetTemplate) {
                            setIsReady(true);
                        }

                    } catch (err) {
                        console.error('Failed to init card player data:', err);
                    }
                }
                initData();
            }, []);

            // 同步主題 CSS 樣式類別至 body
            React.useEffect(() => {
                if (!activeTemplateId || templates.length === 0) return;
                const curTpl = templates.find(t => t.id === activeTemplateId);
                if (curTpl && curTpl.theme) {
                    const body = document.getElementById('app-body');
                    body.className = curTpl.theme.styleClass || '';
                }
            }, [activeTemplateId, templates]);

            const handleSwitchTemplate = (tplId) => {
                setActiveTemplateId(tplId);
                const url = new URL(window.location);
                url.searchParams.set('template', tplId);
                window.history.replaceState({}, '', url);
            };

            const handleStart = () => {
                setIsStarted(true);
                try {
                    const el = document.documentElement;
                    if (el.requestFullscreen) {
                        el.requestFullscreen().catch(() => {});
                    } else if (el.webkitRequestFullscreen) {
                        el.webkitRequestFullscreen().catch(() => {});
                    }
                } catch (e) {}

                if (audioRef.current) {
                    audioRef.current.volume = 0.55;
                    audioRef.current.play().catch(e => {
                        console.log('Audio autoplay blocked or waiting for user interaction:', e);
                    });
                }
            };

            // 雙向鐵壁同步：以 audio 實體 DOM 的 paused 狀態為最高真理
            const toggleAudio = () => {
                const audio = audioRef.current;
                if (!audio) return;
                if (!audio.paused) {
                    audio.pause();
                } else {
                    audio.play().catch(e => console.log('Audio play failed:', e));
                }
            };

            if (!currentCard || templates.length === 0) {
                return (
                    <div className="flex h-screen items-center justify-center bg-black text-zinc-400 select-none">
                        <i className="fa-solid fa-circle-notch fa-spin text-3xl text-amber-400/80"></i>
                    </div>
                );
            }

            const activeTemplate = templates.find(t => t.id === activeTemplateId) || templates[0];
            const rawMusicUrl = (currentCard.media && currentCard.media.customMusic) 
                ? currentCard.media.customMusic 
                : (activeTemplate.defaultMusic || 'assets/audio/In Love With You.mp3');
            const musicUrl = rawMusicUrl ? encodeURI(rawMusicUrl) : '';

            return (
                <div className="relative w-screen h-screen overflow-hidden flex items-center justify-center bg-black" style={{ height: '100dvh' }}>
                    {/* 🎵 音訊 DOM 節點常駐頂層 */}
                    <audio 
                        ref={audioRef} 
                        src={musicUrl} 
                        loop 
                        preload="auto"
                        onPlay={() => setIsPlayingAudio(true)}
                        onPause={() => setIsPlayingAudio(false)}
                    />

                    {/* 🎬 核心卡片全景渲染舞台 */}
                    <div className="w-full h-full z-10 relative">
                        <CardEngine 
                            card={currentCard} 
                            template={activeTemplate} 
                            isStarted={isStarted}
                        />
                    </div>

                    {/* 🎵 音訊控制浮鈕 */}
                    {isStarted && (
                        <AudioControls 
                            isPlayingAudio={isPlayingAudio}
                            onToggleAudio={toggleAudio}
                        />
                    )}

                    {/* 🌟 方案 A：極簡聲波脈衝解鎖微卡浮層 */}
                    {!isStarted && (
                        <WelcomeGate 
                            card={currentCard} 
                            template={activeTemplate} 
                            onStart={handleStart} 
                            isReady={isReady}
                        />
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CardPlayerApp />);
    </script>
</body>
</html>
