<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Greeting Card - CardForge</title>
    
    <!-- Fonts & Tailwind -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Jost:wght@200;300;400;500;600&family=Noto+Serif+TC:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    
    <!-- Three.js (For 3D Particle Planet & Hologram Effects) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- React & Babel -->
    <script src="https://resource.trickle.so/vendor_lib/unpkg/react@18/umd/react.production.min.js"></script>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/@babel/standalone/babel.min.js"></script>

    <!-- Custom Styles -->
    <link href="styles/animations.css" rel="stylesheet">
    <link href="styles/templates.css" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: 'Jost', system-ui, sans-serif;
            width: 100%;
            height: 100%;
            min-height: 100dvh;
            overflow: hidden;
            position: fixed;
        }

        /* Floating Theme Switcher Badge (ONLY visible when ?preview=1 or in debug) */
        .floating-switcher {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 50;
            background: rgba(15, 17, 23, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 9999px;
            padding: 0.35rem 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            transition: opacity 0.3s;
        }

        /* Swatch button for switching themes in preview */
        .swatch-btn {
            width: 18px;
            height: 18px;
            border-radius: 9999px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .swatch-btn:hover {
            transform: scale(1.2);
        }
        .swatch-btn.active {
            box-shadow: 0 0 0 2px #fff, 0 0 8px currentColor;
            transform: scale(1.15);
        }

        /* Recipient Discreet Audio Pill */
        .audio-pill-btn {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 50;
            width: 36px;
            height: 36px;
            border-radius: 9999px;
            background: rgba(15, 17, 23, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .audio-pill-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            transform: scale(1.05);
        }
    </style>
</head>
<body id="app-body">
    <div id="root"></div>

    <!-- Configuration & Pure JS (原生載入無 CORS 限制) -->
    <script src="core/BackdropShader.js"></script>
    <script src="core/ParticleEngine.js"></script>
    <script src="js/config.js"></script>
    <script src="js/gas_client.js"></script>
    <script src="js/workspace_store.js"></script>

    <!-- 
      重要說明：
      在 file:/// 協議下，Babel 無法透過 XHR 讀取外部 JSX 檔案 (會被 Chrome CORS 阻擋)。
      因此將 React JSX 組件集中內聯，保證 100% 零伺服器本地雙擊秒開！
    -->
    <script type="text/babel">
        // =========================================================================
        // 1. CARD ENGINE (渲染舞台)
        // =========================================================================
        function CardEngine({ card, template }) {
            const [currentIndex, setCurrentIndex] = React.useState(0);
            const [isPaused, setIsPaused] = React.useState(false);

            const photos = (card && card.media && card.media.photos && card.media.photos.length > 0)
                ? card.media.photos
                : [];

            const hasPhotos = photos.length > 0;
            const theme = (template && template.theme) || {};
            const effect = (template && template.effects) || {};
            const layout = (card && card.layout) || (template && template.layout) || 'star-wars-crawl';
            const bgShader = (template && template.bgShader) || 'none';
            const bgBrightness = (template && template.bgDimmer) || 0.95;
            const crawlSpeed = `${(template && template.crawlSpeed) || 44}s`;

            React.useEffect(() => {
                if (window.BackdropShader) {
                    window.BackdropShader.init("bg-shader-canvas", bgShader);
                }
                return () => {
                    if (window.BackdropShader) window.BackdropShader.stop();
                };
            }, [bgShader]);

            React.useEffect(() => {
                if (photos.length <= 1) return;
                const interval = setInterval(() => {
                    setCurrentIndex(prev => (prev + 1) % photos.length);
                }, 5000);
                return () => clearInterval(interval);
            }, [photos.length]);

            if (!card) return null;

            return (
                <div 
                    className="absolute inset-0 w-full h-full overflow-hidden select-none"
                    style={{ backgroundColor: theme.bgColor || '#09090b' }}
                >
                    <canvas 
                        id="bg-shader-canvas" 
                        className="absolute inset-0 w-full h-full pointer-events-none z-0" 
                    />

                    {hasPhotos && (
                        <div className="absolute inset-0 w-full h-full pointer-events-none z-0 overflow-hidden">
                            {photos.map((url, idx) => {
                                const isActive = idx === currentIndex;
                                return (
                                    <div
                                        key={url + idx}
                                        className={`absolute inset-0 w-full h-full bg-cover bg-center transition-opacity duration-1000 ease-in-out ${isActive ? 'opacity-100 ken-burns-bg' : 'opacity-0'}`}
                                        style={{
                                            backgroundImage: `url('${url}')`,
                                            filter: `brightness(${bgBrightness}) saturate(1.05)`,
                                            mixBlendMode: bgShader !== 'none' ? 'screen' : 'normal',
                                            opacity: isActive ? (bgShader !== 'none' ? 0.65 : 1) : 0
                                        }}
                                    />
                                );
                            })}
                        </div>
                    )}

                    <div 
                        className="absolute inset-0 pointer-events-none z-10"
                        style={{
                            background: 'radial-gradient(circle at center, rgba(0,0,0,0.02) 0%, rgba(0,0,0,0.35) 100%)'
                        }}
                    />

                    <ParticleEngine effect={{
                        particleType: effect.particleType || 'rising-stardust',
                        color: theme.primaryColor || '#c9a96e',
                        particleDensity: effect.particleDensity || 25
                    }} />

                    <header className="absolute top-0 left-0 right-0 z-30 pt-6 pb-4 text-center px-4 pointer-events-none bg-gradient-to-b from-black/75 via-black/20 to-transparent">
                        <h1 
                            className="text-3xl md:text-5xl font-light tracking-wide clean-title-glow text-white"
                            style={{ 
                                fontFamily: theme.fontFamily || 'serif',
                                '--title-color': theme.titleColor || '#ffffff',
                                '--title-glow': theme.primaryColor || '#c9a96e'
                            }}
                        >
                            {card.title}
                        </h1>
                    </header>

                    {layout === 'star-wars-crawl' && (
                        <div 
                            className="absolute inset-x-0 top-24 bottom-6 z-20 flex justify-center items-start overflow-hidden cursor-pointer crawl-mask-container"
                            onClick={() => setIsPaused(!isPaused)}
                        >
                            <div 
                                className={`w-full max-w-2xl px-6 md:px-8 text-center text-white anim-star-wars-crawl ${isPaused ? 'is-paused' : ''}`}
                                style={{ 
                                    fontFamily: theme.fontFamily || 'serif',
                                    '--crawl-duration': crawlSpeed
                                }}
                            >
                                <div className="w-full py-8 px-4 space-y-8">
                                    {card.recipient && (
                                        <div 
                                            className="text-2xl md:text-3xl font-semibold tracking-wider clean-text-shadow"
                                            style={{ color: theme.primaryColor || '#fbcfe8' }}
                                        >
                                            {card.recipient}
                                        </div>
                                    )}

                                    <div className="space-y-6 text-lg md:text-2xl leading-relaxed font-light tracking-wide clean-text-shadow text-white/95">
                                        {(card.paragraphs || []).map((p, idx) => (
                                            <p key={idx} className="whitespace-pre-line">
                                                {p}
                                            </p>
                                        ))}
                                    </div>

                                    {card.sender && (
                                        <div className="pt-6 text-right">
                                            <p 
                                                className="text-xl md:text-2xl italic font-serif clean-text-shadow whitespace-pre-line font-medium"
                                                style={{ color: theme.primaryColor || '#fbcfe8' }}
                                            >
                                                {card.sender}
                                            </p>
                                        </div>
                                    )}

                                    {card.cta && card.cta.length > 0 && (
                                        <div className="pt-8 flex flex-wrap gap-4 justify-center pointer-events-auto">
                                            {card.cta.map((btn, idx) => (
                                                <a
                                                    key={idx}
                                                    href={btn.url}
                                                    target="_blank"
                                                    rel="noopener noreferrer"
                                                    className="inline-flex items-center gap-2 px-6 py-2.5 rounded-full text-sm font-semibold tracking-wider uppercase border border-white text-white bg-black/40 hover:bg-black/70 backdrop-blur-md transition-all duration-300 hover:scale-105 shadow-lg"
                                                    style={{ borderColor: theme.primaryColor }}
                                                >
                                                    {btn.icon && <i className={`fa-solid ${btn.icon}`}></i>}
                                                    <span>{btn.label}</span>
                                                </a>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {layout === 'boxed-card' && (
                        <div className="absolute inset-x-0 top-24 bottom-6 z-20 overflow-y-auto custom-scrollbar flex justify-center items-center p-4 md:p-6">
                            <div 
                                className="max-w-2xl w-full rounded-2xl p-6 md:p-8 backdrop-blur-xl border border-white/15 shadow-2xl space-y-6"
                                style={{ 
                                    background: 'rgba(15, 17, 23, 0.85)',
                                    fontFamily: theme.fontFamily || 'serif'
                                }}
                            >
                                {hasPhotos && (
                                    <div className="relative aspect-[16/9] w-full rounded-xl overflow-hidden shadow-lg border border-white/10">
                                        <img
                                            src={photos[currentIndex]}
                                            alt="Slide"
                                            className="w-full h-full object-cover transition-transform duration-700 hover:scale-105"
                                        />
                                        <div className="absolute bottom-2 right-2 px-2.5 py-0.5 rounded-full bg-black/60 backdrop-blur-md text-[11px] text-white/80">
                                            {currentIndex + 1} / {photos.length}
                                        </div>
                                    </div>
                                )}

                                {card.recipient && (
                                    <h2 
                                        className="text-xl md:text-2xl font-semibold tracking-wider border-b border-white/10 pb-3"
                                        style={{ color: theme.primaryColor || '#c9a96e' }}
                                    >
                                        {card.recipient}
                                    </h2>
                                )}

                                <div className="space-y-4 text-base md:text-lg leading-relaxed text-zinc-200 font-light">
                                    {(card.paragraphs || []).map((p, idx) => (
                                        <p key={idx} className="whitespace-pre-line">
                                            {p}
                                        </p>
                                    ))}
                                </div>

                                {card.sender && (
                                    <div className="pt-4 border-t border-white/10 text-right">
                                        <p 
                                            className="text-lg md:text-xl italic font-serif whitespace-pre-line font-medium"
                                            style={{ color: theme.primaryColor || '#c9a96e' }}
                                        >
                                            {card.sender}
                                        </p>
                                    </div>
                                )}

                                {card.cta && card.cta.length > 0 && (
                                    <div className="pt-4 flex flex-wrap gap-3 justify-center">
                                        {card.cta.map((btn, idx) => (
                                            <a
                                                key={idx}
                                                href={btn.url}
                                                target="_blank"
                                                rel="noopener noreferrer"
                                                className="inline-flex items-center gap-2 px-6 py-2.5 rounded-full text-sm font-semibold tracking-wider uppercase border border-current text-white bg-white/10 hover:bg-white/25 transition-all shadow-md"
                                                style={{ color: theme.primaryColor }}
                                            >
                                                {btn.icon && <i className={`fa-solid ${btn.icon}`}></i>}
                                                <span>{btn.label}</span>
                                            </a>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }
        window.CardEngine = CardEngine;

        // =========================================================================
        // 2. CHILD COMPONENTS (受眾端子組件)
        // =========================================================================
        
        // 開門封面遮罩 (解鎖 Web Audio 與進入全螢幕)
        function WelcomeGate({ card, template, onStart }) {
            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center relative z-20 bg-black">
                    <ParticleEngine effect={template.effects} />
                    
                    <div className="max-w-md w-full p-8 md:p-10 rounded-2xl bg-zinc-900/80 backdrop-blur-2xl border border-white/15 shadow-2xl space-y-6">
                        <h1 className="text-3xl md:text-4xl font-light text-white" style={{ fontFamily: template.theme?.fontFamily }}>
                            {card.title || '一份特別的祝福'}
                        </h1>
                        <p className="text-sm text-zinc-400">
                            {card.recipient ? `致 ${card.recipient}` : '請點擊開啟專屬沉浸式卡片'}
                        </p>
                        
                        <button
                            onClick={onStart}
                            className="w-full py-3.5 px-6 rounded-xl font-medium tracking-wide transition-all duration-300 transform active:scale-95 shadow-lg flex items-center justify-center gap-2 group"
                            style={{
                                backgroundColor: template.theme?.primaryColor || '#c9a96e',
                                color: template.theme?.bgColor || '#09090b'
                            }}
                        >
                            <i className="fa-solid fa-envelope-open text-sm group-hover:scale-110 transition-transform"></i>
                            <span>開啟賀卡與音樂體驗</span>
                        </button>
                        
                        <div className="text-[11px] text-zinc-500 flex items-center justify-center gap-1.5 pt-2">
                            <i className="fa-solid fa-headphones text-[10px]"></i>
                            <span>佩戴耳機或開啟聲音體驗最佳</span>
                        </div>
                    </div>
                </div>
            );
        }

        // 音訊與風格切換控制浮鈕 (預覽模式展示色票，受眾模式極簡藥丸鈕)
        function AudioControls({ isPreviewMode, templates, activeTemplateId, isPlayingAudio, onSwitchTemplate, onToggleAudio }) {
            if (isPreviewMode) {
                return (
                    <div className="floating-switcher">
                        <span className="text-xs text-zinc-300 font-medium hidden sm:inline">切換風格:</span>
                        <div className="flex items-center gap-2">
                            {templates.map(t => (
                                <button
                                    key={t.id}
                                    title={`切換為「${t.name}」風格`}
                                    onClick={() => onSwitchTemplate(t.id)}
                                    className={`swatch-btn ${activeTemplateId === t.id ? 'active' : ''}`}
                                    style={{
                                        backgroundColor: t.theme?.primaryColor || '#ffffff',
                                        color: t.theme?.primaryColor || '#ffffff'
                                    }}
                                />
                            ))}
                        </div>
                        <div className="h-4 w-px bg-white/20 mx-1"></div>
                        <button 
                            onClick={onToggleAudio}
                            title={isPlayingAudio ? "暫停音樂" : "播放音樂"}
                            className="text-zinc-200 hover:text-white transition-colors text-sm"
                        >
                            <i className={`fa-solid ${isPlayingAudio ? 'fa-volume-high' : 'fa-volume-xmark'}`}></i>
                        </button>
                    </div>
                );
            }

            return (
                <button
                    onClick={onToggleAudio}
                    title={isPlayingAudio ? "暫停音樂" : "播放音樂"}
                    className="audio-pill-btn"
                >
                    <i className={`fa-solid ${isPlayingAudio ? 'fa-volume-high' : 'fa-volume-xmark'} text-xs`}></i>
                </button>
            );
        }

        // =========================================================================
        // 3. CARD PLAYER APP (受眾端播放器主入口)
        // =========================================================================
        function CardPlayerApp() {
            const [templates, setTemplates] = React.useState([]);
            const [currentCard, setCurrentCard] = React.useState(null);
            const [activeTemplateId, setActiveTemplateId] = React.useState(null);
            const [isStarted, setIsStarted] = React.useState(false);
            const [isPlayingAudio, setIsPlayingAudio] = React.useState(false);
            const [isPreviewMode, setIsPreviewMode] = React.useState(false);
            const audioRef = React.useRef(null);

            // 初始化卡片與模板數據 (透過 WorkspaceStore 與 GasClient SSOT)
            React.useEffect(() => {
                async function initData() {
                    try {
                        const { cards: loadedCards, templates: loadedTemplates } = await window.WorkspaceStore.loadInitialData();
                        setTemplates(loadedTemplates || []);

                        const urlParams = new URLSearchParams(window.location.search);
                        const cardIdParam = urlParams.get('id') || urlParams.get('card');
                        const templateParam = urlParams.get('template');
                        const previewParam = urlParams.get('preview');

                        setIsPreviewMode(previewParam === '1' || previewParam === 'true');

                        let targetCard = null;
                        if (cardIdParam && window.GasClient) {
                            targetCard = await window.GasClient.getCard(cardIdParam, (updatedCard) => {
                                if (updatedCard) {
                                    setCurrentCard(updatedCard);
                                    if (updatedCard.templateId && !templateParam) {
                                        setActiveTemplateId(updatedCard.templateId);
                                    }
                                }
                            });
                        }

                        if (!targetCard) {
                            targetCard = (loadedCards && loadedCards.length > 0)
                                ? (loadedCards.find(c => c.id === cardIdParam) || loadedCards[0])
                                : null;
                        }

                        setCurrentCard(targetCard);
                        const effectiveTemplateId = templateParam || (targetCard ? targetCard.templateId : 'mothers-day');
                        setActiveTemplateId(effectiveTemplateId);

                    } catch (err) {
                        console.error('Failed to init card player data:', err);
                    }
                }
                initData();
            }, []);

            // 同步主題 CSS 樣式類別至 body
            React.useEffect(() => {
                if (!activeTemplateId || templates.length === 0) return;
                const curTpl = templates.find(t => t.id === activeTemplateId);
                if (curTpl && curTpl.theme) {
                    const body = document.getElementById('app-body');
                    body.className = curTpl.theme.styleClass || '';
                }
            }, [activeTemplateId, templates]);

            const handleSwitchTemplate = (tplId) => {
                setActiveTemplateId(tplId);
                const url = new URL(window.location);
                url.searchParams.set('template', tplId);
                window.history.replaceState({}, '', url);
            };

            const handleStart = () => {
                setIsStarted(true);
                try {
                    const el = document.documentElement;
                    if (el.requestFullscreen) {
                        el.requestFullscreen().catch(() => {});
                    } else if (el.webkitRequestFullscreen) {
                        el.webkitRequestFullscreen().catch(() => {});
                    }
                } catch (e) {}

                if (audioRef.current) {
                    audioRef.current.volume = 0.55;
                    audioRef.current.play().then(() => {
                        setIsPlayingAudio(true);
                    }).catch(e => {
                        console.log('Audio playback initiated:', e);
                        setIsPlayingAudio(true);
                    });
                }
            };

            const toggleAudio = () => {
                if (!audioRef.current) return;
                if (isPlayingAudio) {
                    audioRef.current.pause();
                    setIsPlayingAudio(false);
                } else {
                    audioRef.current.play();
                    setIsPlayingAudio(true);
                }
            };

            if (!currentCard || templates.length === 0) {
                return (
                    <div className="flex h-screen items-center justify-center text-zinc-400">
                        <i className="fa-solid fa-spinner fa-spin text-2xl mr-3"></i>
                        <span>載入專屬賀卡中...</span>
                    </div>
                );
            }

            const activeTemplate = templates.find(t => t.id === activeTemplateId) || templates[0];
            const musicUrl = (currentCard.media && currentCard.media.customMusic) 
                ? currentCard.media.customMusic 
                : (activeTemplate.defaultMusic || 'assets/audio/In Love With You.mp3');

            if (!isStarted) {
                return (
                    <WelcomeGate 
                        card={currentCard} 
                        template={activeTemplate} 
                        onStart={handleStart} 
                    />
                );
            }

            return (
                <div className="relative w-screen h-screen overflow-hidden" style={{ height: '100dvh' }}>
                    <audio ref={audioRef} src={musicUrl} loop autoPlay />

                    <AudioControls 
                        isPreviewMode={isPreviewMode}
                        templates={templates}
                        activeTemplateId={activeTemplateId}
                        isPlayingAudio={isPlayingAudio}
                        onSwitchTemplate={handleSwitchTemplate}
                        onToggleAudio={toggleAudio}
                    />

                    <CardEngine 
                        card={currentCard} 
                        template={activeTemplate} 
                    />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CardPlayerApp />);
    </script>
</body>
</html>
