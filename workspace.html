<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardForge Studio - 所見即所得賀卡與模板工坊</title>

    <!-- Fonts & Tailwind -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Jost:wght@300;400;500;600;700&family=Noto+Serif+TC:wght@300;400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <!-- Three.js (For Live Preview) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- React & Babel -->
    <script src="https://resource.trickle.so/vendor_lib/unpkg/react@18/umd/react.production.min.js"></script>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/@babel/standalone/babel.min.js"></script>

    <!-- Custom Styles (純 CSS 無 CORS 限制) -->
    <link href="styles/animations.css" rel="stylesheet">
    <link href="styles/templates.css" rel="stylesheet">
    <link href="css/workspace.css" rel="stylesheet">
</head>
<body class="bg-[#08090d] text-zinc-200">
    <div id="root"></div>

    <!-- Configuration & Pure JS (原生載入無 CORS 限制) -->
    <script src="core/BackdropShader.js"></script>
    <script src="core/ParticleEngine.js"></script>
    <script src="js/constants.js"></script>
    <script src="js/config.js"></script>
    <script src="js/gas_client.js"></script>
    <script src="js/workspace_store.js"></script>

    <!-- 
      重要說明：
      在 file:/// 協議下，Babel 無法透過 XHR 讀取外部 JSX 檔案 (會被 Chrome CORS 阻擋)。
      純 JS 模組 (ParticleEngine, constants, config, gas_client) 走原生 script 標籤載入，
      頂層 React 視圖路由維持內聯，保證 100% 模組化且零伺服器本機雙擊秒開！
    -->
    <script type="text/babel">
        // =========================================================================
        // 1. CARD ENGINE (渲染舞台)
        // =========================================================================
        function CardEngine({ card, template }) {
            const [currentIndex, setCurrentIndex] = React.useState(0);
            const [isPaused, setIsPaused] = React.useState(false);

            const photos = (card && card.media && card.media.photos && card.media.photos.length > 0)
                ? card.media.photos
                : [];

            const hasPhotos = photos.length > 0;
            const theme = (template && template.theme) || {};
            const effect = (template && template.effects) || {};
            const layout = (card && card.layout) || (template && template.layout) || 'star-wars-crawl';
            const bgShader = (template && template.bgShader) || 'none';
            const bgBrightness = (template && template.bgDimmer) || 0.95;
            const crawlSpeed = `${(template && template.crawlSpeed) || 44}s`;

            React.useEffect(() => {
                if (window.BackdropShader) {
                    window.BackdropShader.init("bg-shader-canvas", bgShader);
                }
                return () => {
                    if (window.BackdropShader) window.BackdropShader.stop();
                };
            }, [bgShader]);

            React.useEffect(() => {
                if (photos.length <= 1) return;
                const interval = setInterval(() => {
                    setCurrentIndex(prev => (prev + 1) % photos.length);
                }, 5000);
                return () => clearInterval(interval);
            }, [photos.length]);

            if (!card) return null;

            return (
                <div 
                    className="absolute inset-0 w-full h-full overflow-hidden select-none"
                    style={{ backgroundColor: theme.bgColor || '#09090b' }}
                >
                    <canvas 
                        id="bg-shader-canvas" 
                        className="absolute inset-0 w-full h-full pointer-events-none z-0" 
                    />

                    {hasPhotos && (
                        <div className="absolute inset-0 w-full h-full pointer-events-none z-0 overflow-hidden">
                            {photos.map((url, idx) => {
                                const isActive = idx === currentIndex;
                                return (
                                    <div
                                        key={url + idx}
                                        className={`absolute inset-0 w-full h-full bg-cover bg-center transition-opacity duration-1000 ease-in-out ${isActive ? 'opacity-100 ken-burns-bg' : 'opacity-0'}`}
                                        style={{
                                            backgroundImage: `url('${url}')`,
                                            filter: `brightness(${bgBrightness}) saturate(1.05)`,
                                            mixBlendMode: bgShader !== 'none' ? 'screen' : 'normal',
                                            opacity: isActive ? (bgShader !== 'none' ? 0.65 : 1) : 0
                                        }}
                                    />
                                );
                            })}
                        </div>
                    )}

                    <div 
                        className="absolute inset-0 pointer-events-none z-10"
                        style={{
                            background: 'radial-gradient(circle at center, rgba(0,0,0,0.02) 0%, rgba(0,0,0,0.35) 100%)'
                        }}
                    />

                    <ParticleEngine effect={{
                        particleType: effect.particleType || 'rising-stardust',
                        color: theme.primaryColor || '#c9a96e',
                        particleDensity: effect.particleDensity || 25
                    }} />

                    <header className="absolute top-0 left-0 right-0 z-30 pt-6 pb-4 text-center px-4 pointer-events-none bg-gradient-to-b from-black/75 via-black/20 to-transparent">
                        <h1 
                            className="text-3xl md:text-5xl font-light tracking-wide clean-title-glow text-white"
                            style={{ 
                                fontFamily: theme.fontFamily || 'serif',
                                '--title-color': theme.titleColor || '#ffffff',
                                '--title-glow': theme.primaryColor || '#c9a96e'
                            }}
                        >
                            {card.title}
                        </h1>
                    </header>

                    {layout === 'star-wars-crawl' && (
                        <div 
                            className="absolute inset-x-0 top-24 bottom-6 z-20 flex justify-center items-start overflow-hidden cursor-pointer crawl-mask-container"
                            onClick={() => setIsPaused(!isPaused)}
                        >
                            <div 
                                className={`w-full max-w-2xl px-6 md:px-8 text-center text-white anim-star-wars-crawl ${isPaused ? 'is-paused' : ''}`}
                                style={{ 
                                    fontFamily: theme.fontFamily || 'serif',
                                    '--crawl-duration': crawlSpeed
                                }}
                            >
                                <div className="w-full py-8 px-4 space-y-8">
                                    {card.recipient && (
                                        <div 
                                            className="text-2xl md:text-3xl font-semibold tracking-wider clean-text-shadow"
                                            style={{ color: theme.primaryColor || '#fbcfe8' }}
                                        >
                                            {card.recipient}
                                        </div>
                                    )}

                                    <div className="space-y-6 text-lg md:text-2xl leading-relaxed font-light tracking-wide clean-text-shadow text-white/95">
                                        {(card.paragraphs || []).map((p, idx) => (
                                            <p key={idx} className="whitespace-pre-line">
                                                {p}
                                            </p>
                                        ))}
                                    </div>

                                    {card.sender && (
                                        <div className="pt-6 text-right">
                                            <p 
                                                className="text-xl md:text-2xl italic font-serif clean-text-shadow whitespace-pre-line font-medium"
                                                style={{ color: theme.primaryColor || '#fbcfe8' }}
                                            >
                                                {card.sender}
                                            </p>
                                        </div>
                                    )}

                                    {card.cta && card.cta.length > 0 && (
                                        <div className="pt-8 flex flex-wrap gap-4 justify-center pointer-events-auto">
                                            {card.cta.map((btn, idx) => (
                                                <a
                                                    key={idx}
                                                    href={btn.url}
                                                    target="_blank"
                                                    rel="noopener noreferrer"
                                                    className="inline-flex items-center gap-2 px-6 py-2.5 rounded-full text-sm font-semibold tracking-wider uppercase border border-white text-white bg-black/40 hover:bg-black/70 backdrop-blur-md transition-all duration-300 hover:scale-105 shadow-lg"
                                                    style={{ borderColor: theme.primaryColor }}
                                                >
                                                    {btn.icon && <i className={`fa-solid ${btn.icon}`}></i>}
                                                    <span>{btn.label}</span>
                                                </a>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {layout === 'boxed-card' && (
                        <div className="absolute inset-x-0 top-24 bottom-6 z-20 overflow-y-auto custom-scrollbar flex justify-center items-center p-4 md:p-6">
                            <div 
                                className="max-w-2xl w-full rounded-2xl p-6 md:p-8 backdrop-blur-xl border border-white/15 shadow-2xl space-y-6"
                                style={{ 
                                    background: 'rgba(15, 17, 23, 0.85)',
                                    fontFamily: theme.fontFamily || 'serif'
                                }}
                            >
                                {hasPhotos && (
                                    <div className="relative aspect-[16/9] w-full rounded-xl overflow-hidden shadow-lg border border-white/10">
                                        <img
                                            src={photos[currentIndex]}
                                            alt="Slide"
                                            className="w-full h-full object-cover transition-transform duration-700 hover:scale-105"
                                        />
                                        <div className="absolute bottom-2 right-2 px-2.5 py-0.5 rounded-full bg-black/60 backdrop-blur-md text-[11px] text-white/80">
                                            {currentIndex + 1} / {photos.length}
                                        </div>
                                    </div>
                                )}

                                {card.recipient && (
                                    <h2 
                                        className="text-xl md:text-2xl font-semibold tracking-wider border-b border-white/10 pb-3"
                                        style={{ color: theme.primaryColor || '#c9a96e' }}
                                    >
                                        {card.recipient}
                                    </h2>
                                )}

                                <div className="space-y-4 text-base md:text-lg leading-relaxed text-zinc-200 font-light">
                                    {(card.paragraphs || []).map((p, idx) => (
                                        <p key={idx} className="whitespace-pre-line">
                                            {p}
                                        </p>
                                    ))}
                                </div>

                                {card.sender && (
                                    <div className="pt-4 border-t border-white/10 text-right">
                                        <p 
                                            className="text-lg md:text-xl italic font-serif whitespace-pre-line font-medium"
                                            style={{ color: theme.primaryColor || '#c9a96e' }}
                                        >
                                            {card.sender}
                                        </p>
                                    </div>
                                )}

                                {card.cta && card.cta.length > 0 && (
                                    <div className="pt-4 flex flex-wrap gap-3 justify-center">
                                        {card.cta.map((btn, idx) => (
                                            <a
                                                key={idx}
                                                href={btn.url}
                                                target="_blank"
                                                rel="noopener noreferrer"
                                                className="inline-flex items-center gap-2 px-6 py-2.5 rounded-full text-sm font-semibold tracking-wider uppercase border border-current text-white bg-white/10 hover:bg-white/25 transition-all shadow-md"
                                                style={{ color: theme.primaryColor }}
                                            >
                                                {btn.icon && <i className={`fa-solid ${btn.icon}`}></i>}
                                                <span>{btn.label}</span>
                                            </a>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }
        // =========================================================================
        // 2. WORKSPACE MODAL DIALOGS (彈窗元件)
        // =========================================================================
        function PreviewModal({ modalCard, onClose, onCloudPublish }) {
            if (!modalCard) return null;
            return (
                <div className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex flex-col items-center justify-center p-4">
                    <div className="absolute top-4 right-4 z-20 flex items-center gap-3">
                        <button
                            onClick={() => onCloudPublish(modalCard.card)}
                            className="px-4 py-2 rounded-lg bg-sky-500 hover:bg-sky-400 text-white font-bold text-xs flex items-center gap-2 shadow-lg transition-all"
                        >
                            <i className="fa-solid fa-cloud-arrow-up"></i>
                            <span>發布雲端短網址</span>
                        </button>
                        <button
                            onClick={onClose}
                            className="w-10 h-10 rounded-full bg-zinc-800/80 hover:bg-zinc-700 text-white flex items-center justify-center transition-colors text-base"
                        >
                            <i className="fa-solid fa-xmark"></i>
                        </button>
                    </div>

                    <div className="w-full max-w-sm h-[85vh] max-h-[720px] rounded-3xl overflow-hidden shadow-2xl border border-zinc-700/60 relative bg-black">
                        <CardEngine
                            card={modalCard.card}
                            template={modalCard.template}
                        />
                    </div>
                </div>
            );
        }

        function CloudShareModal({ shareModal, onClose, onShowToast }) {
            if (!shareModal) return null;
            return (
                <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 cloud-toast">
                    <div className="bg-zinc-900 border border-zinc-700 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                        <div className="flex items-center justify-between">
                            <div className="flex items-center gap-2.5">
                                <span className="w-8 h-8 rounded-full bg-sky-500/20 text-sky-400 flex items-center justify-center text-sm font-bold border border-sky-500/30">
                                    <i className="fa-solid fa-cloud-check"></i>
                                </span>
                                <div>
                                    <h3 className="font-bold text-white text-base">賀卡雲端分享已就緒</h3>
                                    <p className="text-[11px] text-zinc-400">免 Git Commit ✕ 自動生成社群圖文預覽</p>
                                </div>
                            </div>
                            <button 
                                onClick={onClose}
                                className="text-zinc-400 hover:text-white text-lg p-1"
                            >
                                <i className="fa-solid fa-xmark"></i>
                            </button>
                        </div>

                        {shareModal.isSaving ? (
                            <div className="py-8 flex flex-col items-center justify-center space-y-3">
                                <i className="fa-solid fa-circle-notch fa-spin text-3xl text-sky-400"></i>
                                <p className="text-xs text-zinc-300 font-medium">{shareModal.statusText}</p>
                            </div>
                        ) : (
                            <div className="space-y-4">
                                <div className="p-3 bg-zinc-950 rounded-lg border border-zinc-800 space-y-1.5 text-xs">
                                    <div className="text-zinc-400">專屬短分享網址：</div>
                                    <div className="flex items-center gap-2">
                                        <input 
                                            type="text" 
                                            readOnly 
                                            value={shareModal.shareUrl} 
                                            className="flex-1 bg-zinc-900 border border-zinc-700 rounded px-2.5 py-1.5 text-sky-300 text-xs font-mono outline-none"
                                        />
                                        <button
                                            onClick={() => {
                                                navigator.clipboard.writeText(shareModal.shareUrl);
                                                onShowToast('已複製分享短網址！');
                                            }}
                                            className="px-3 py-1.5 bg-amber-400 hover:bg-amber-300 text-zinc-950 font-bold rounded text-xs shrink-0 shadow"
                                        >
                                            複製
                                        </button>
                                    </div>
                                </div>

                                <div className="p-3 bg-sky-950/40 rounded-lg border border-sky-800/40 space-y-1 text-[11px] text-sky-200/90">
                                    <div className="font-bold flex items-center gap-1.5 text-sky-300">
                                        <i className="fa-solid fa-circle-info"></i>
                                        <span>社群預覽卡片 (Open Graph) 已生效</span>
                                    </div>
                                    <p className="leading-relaxed text-zinc-400">
                                        將此連結直接貼至 <strong>LINE、Facebook、WhatsApp、WeChat</strong>，受眾視窗會自動呈現此卡片的自訂標題、封面圖與祝福摘要！
                                    </p>
                                </div>

                                <div className="flex items-center justify-end gap-2 pt-2">
                                    <a
                                        href={shareModal.shareUrl}
                                        target="_blank"
                                        className="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-white rounded text-xs font-medium flex items-center gap-1.5 transition-colors"
                                    >
                                        <i className="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                                        <span>親自體驗播放</span>
                                    </a>
                                    <button
                                        onClick={onClose}
                                        className="px-4 py-2 bg-sky-500 hover:bg-sky-400 text-white font-bold rounded text-xs shadow-lg transition-all"
                                    >
                                        關閉完成
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // =========================================================================
        // 3. WORKSPACE NAVBAR (頂部導覽列組件)
        // =========================================================================
        function WorkspaceNavbar({
            currentView,
            setCurrentView,
            activeGalleryTab,
            setActiveGalleryTab,
            cardsCount,
            templatesCount,
            editingTemplate,
            setEditingTemplate,
            currentEditingCard,
            editorPreviewDevice,
            setEditorPreviewDevice,
            onSaveTemplate,
            onCloudPublish,
            onExportAllJSON
        }) {
            return (
                <header className="h-14 border-b border-zinc-800/80 bg-zinc-950 px-6 flex items-center justify-between sticky top-0 z-30 shadow-md">
                    <div className="flex items-center gap-3">
                        <span className="w-8 h-8 rounded-lg bg-gradient-to-tr from-amber-400 via-rose-500 to-indigo-500 flex items-center justify-center text-zinc-950 font-black text-xs shadow">
                            CF
                        </span>
                        <div>
                            <div className="flex items-center gap-2">
                                <span className="font-bold tracking-wide text-sm text-white">CardForge Studio</span>
                                <span className="px-1.5 py-0.5 rounded text-[10px] bg-amber-400/10 text-amber-300 border border-amber-400/20 font-mono">
                                    3D Canvas + Cloud SSOT
                                </span>
                            </div>
                            <div className="text-[10px] text-zinc-500">免 Git Commit ✕ 社交動態預覽 ✕ 雙軌賀卡工坊</div>
                        </div>
                    </div>

                    {currentView === 'gallery' ? (
                        <nav className="flex items-center bg-zinc-900 border border-zinc-800 rounded-lg p-1 text-xs">
                            <button
                                onClick={() => setActiveGalleryTab('cards')}
                                className={`px-4 py-1.5 rounded-md flex items-center gap-2 font-medium transition-all ${activeGalleryTab === 'cards' ? 'bg-amber-400 text-zinc-950 font-bold shadow' : 'text-zinc-400 hover:text-white'}`}
                            >
                                <i className="fa-solid fa-address-card"></i>
                                <span>卡片管理 ({cardsCount})</span>
                            </button>
                            <button
                                onClick={() => setActiveGalleryTab('templates')}
                                className={`px-4 py-1.5 rounded-md flex items-center gap-2 font-medium transition-all ${activeGalleryTab === 'templates' ? 'bg-indigo-500 text-white font-bold shadow' : 'text-zinc-400 hover:text-white'}`}
                            >
                                <i className="fa-solid fa-wand-magic-sparkles"></i>
                                <span>模板管理 ({templatesCount})</span>
                            </button>
                        </nav>
                    ) : currentView === 'template_editor' ? (
                        <div className="flex items-center gap-3">
                            <button
                                onClick={() => {
                                    setEditingTemplate(null);
                                    setCurrentView('gallery');
                                }}
                                className="px-4 py-1.5 rounded-lg bg-zinc-900 border border-zinc-700 hover:border-indigo-400 hover:bg-zinc-800 text-indigo-300 font-bold text-xs flex items-center gap-2 shadow transition-all"
                            >
                                <i className="fa-solid fa-arrow-left"></i>
                                <span>返回模板庫</span>
                            </button>
                            <span className="text-zinc-500 text-xs">|</span>
                            <span className="text-xs text-zinc-300 font-medium hidden sm:inline">
                                正在設計模板：<span className="text-indigo-300 font-bold">{editingTemplate?.name}</span>
                            </span>
                        </div>
                    ) : (
                        <div className="flex items-center gap-3">
                            <button
                                onClick={() => setCurrentView('gallery')}
                                className="px-4 py-1.5 rounded-lg bg-zinc-900 border border-zinc-700 hover:border-amber-400 hover:bg-zinc-800 text-amber-300 font-bold text-xs flex items-center gap-2 shadow transition-all"
                            >
                                <i className="fa-solid fa-arrow-left"></i>
                                <span>返回卡片庫</span>
                            </button>
                            <span className="text-zinc-500 text-xs">|</span>
                            <span className="text-xs text-zinc-300 font-medium hidden sm:inline">
                                正在編輯：<span className="text-amber-300 font-bold">{currentEditingCard?.name}</span>
                            </span>
                        </div>
                    )}

                    <div className="flex items-center gap-3">
                        {/* 頂部預覽模式切換開關 (由中間畫布搬遷至頂部 Navbar) */}
                        {(currentView === 'card_editor' || currentView === 'template_editor') && (
                            <div className="flex items-center gap-1.5 bg-zinc-900 border border-zinc-700/80 px-2.5 py-1 rounded-full text-xs shadow-inner">
                                <span className="text-zinc-400 text-[11px] font-mono pl-1 hidden md:inline">視角：</span>
                                <button
                                    type="button"
                                    onClick={() => setEditorPreviewDevice('mobile')}
                                    className={`px-2.5 py-0.5 rounded-full flex items-center gap-1 transition-all text-xs ${editorPreviewDevice === 'mobile' ? (currentView === 'template_editor' ? 'bg-indigo-500 text-white font-bold shadow' : 'bg-amber-400 text-zinc-950 font-bold shadow') : 'text-zinc-400 hover:text-white'}`}
                                >
                                    <i className="fa-solid fa-mobile-screen text-[10px]"></i>
                                    <span>手機</span>
                                </button>
                                <button
                                    type="button"
                                    onClick={() => setEditorPreviewDevice('desktop')}
                                    className={`px-2.5 py-0.5 rounded-full flex items-center gap-1 transition-all text-xs ${editorPreviewDevice === 'desktop' ? (currentView === 'template_editor' ? 'bg-indigo-500 text-white font-bold shadow' : 'bg-amber-400 text-zinc-950 font-bold shadow') : 'text-zinc-400 hover:text-white'}`}
                                >
                                    <i className="fa-solid fa-desktop text-[10px]"></i>
                                    <span>桌面寬屏</span>
                                </button>
                            </div>
                        )}

                        {currentView === 'template_editor' && editingTemplate && (
                            <button
                                onClick={onSaveTemplate}
                                className="px-4 py-1.5 text-xs rounded bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-400 hover:to-purple-500 text-white font-bold flex items-center gap-1.5 shadow-lg shadow-indigo-500/25 transition-all border border-indigo-400/40"
                                title="保存當前模板視覺與 3D 特效規格"
                            >
                                <i className="fa-solid fa-floppy-disk"></i>
                                <span>保存模板規格</span>
                            </button>
                        )}

                        {currentView === 'card_editor' && (
                            <button
                                onClick={onCloudPublish}
                                className="px-3.5 py-1.5 text-xs rounded bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 text-white font-bold flex items-center gap-1.5 shadow-lg shadow-sky-500/20 transition-all border border-sky-400/30"
                                title="儲存至 Google Sheet SSOT 並取得社群預覽分享短網址"
                            >
                                <i className="fa-solid fa-cloud-arrow-up"></i>
                                <span>發布至雲端 (免 Commit)</span>
                            </button>
                        )}

                        <button
                            onClick={onExportAllJSON}
                            title="匯出完整 JSON 台帳備份"
                            className="px-3 py-1.5 text-xs rounded border border-zinc-700 bg-zinc-900 hover:bg-zinc-800 text-zinc-300 hidden md:flex items-center gap-1.5 transition-colors"
                        >
                            <i className="fa-solid fa-download"></i>

        // =========================================================================
