<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardForge Studio - 所見即所得賀卡與模板工坊</title>

    <!-- Fonts & Tailwind -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Jost:wght@300;400;500;600;700&family=Noto+Serif+TC:wght@300;400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <!-- Three.js (For Live Preview) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- React & Babel -->
    <script src="https://resource.trickle.so/vendor_lib/unpkg/react@18/umd/react.production.min.js"></script>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/@babel/standalone/babel.min.js"></script>

    <!-- Custom Styles (純 CSS 無 CORS 限制) -->
    <link href="styles/animations.css" rel="stylesheet">
    <link href="styles/templates.css" rel="stylesheet">
    <link href="css/workspace.css" rel="stylesheet">
</head>
<body class="bg-[#08090d] text-zinc-200">
    <div id="root"></div>

    <!-- Configuration & Pure JS (原生載入無 CORS 限制) -->
    <script src="core/BackdropShader.js"></script>
    <script src="core/ParticleEngine.js"></script>
    <script src="core/CardEngine.js"></script>
    <script src="js/constants.js"></script>
    <script src="js/config.js"></script>
    <script src="js/gas_client.js"></script>
    <script src="js/workspace_store.js"></script>
    <script src="js/image_uploader.js"></script>
    <script src="js/workspace_views.js"></script>

    <!-- 
      重要說明：
      在 file:/// 協議下，Babel 無法透過 XHR 讀取外部 JSX 檔案 (會被 Chrome CORS 阻擋)。
      純 JS 模組 (ParticleEngine, constants, config, gas_client) 走原生 script 標籤載入，
      頂層 React 視圖路由維持內聯，保證 100% 模組化且零伺服器本機雙擊秒開！
    -->
    <script type="text/babel">
        // 引用外部已模組化的核心渲染舞台 (core/CardEngine.js)
        // 解構外部純 JS 模組化視圖組件 (js/workspace_views.js)
        const {
            PreviewModal,
            CloudShareModal,
            WorkspaceNavbar,
            CardsGallery,
            TemplatesGallery
        } = window.WorkspaceViews;

        // =========================================================================
        // 5. WORKSPACE APP (創作者工坊主體)
        // =========================================================================
        const TEMPLATE_DUMMY_CARD = window.TEMPLATE_DUMMY_CARD;

        function CardForgeApp() {
            const [currentView, setCurrentView] = React.useState('gallery'); // 'gallery' | 'card_editor' | 'template_editor'
            const [activeGalleryTab, setActiveGalleryTab] = React.useState('cards');
            const [cards, setCards] = React.useState([]);
            const [templates, setTemplates] = React.useState([]);
            const [editingCardId, setEditingCardId] = React.useState(null);
            const [editingTemplate, setEditingTemplate] = React.useState(null);

            const [previewModalCard, setPreviewModalCard] = React.useState(null);
            const [cloudShareModal, setCloudShareModal] = React.useState(null);
            const [editorPreviewDevice, setEditorPreviewDevice] = React.useState('mobile');
            const [toastMessage, setToastMessage] = React.useState('');
            const [uploadStatus, setUploadStatus] = React.useState(null); // { isUploading: bool, message: string }
            const fileInputRef = React.useRef(null);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 3000);
            };

            React.useEffect(() => {
                const init = async () => {
                    if (window.WorkspaceStore) {
                        const { cards: initCards, templates: initTpls } = await window.WorkspaceStore.loadInitialData();
                        setCards(initCards);
                        setTemplates(initTpls);

                        if (window.GasClient) {
                            window.GasClient.listCards().then(cloudList => {
                                if (cloudList && cloudList.length > 0) {
                                    setCards(prevCards => {
                                        const map = new Map(prevCards.map(c => [c.id, c]));
                                        cloudList.forEach(cc => {
                                            if (!map.has(cc.id)) {
                                                map.set(cc.id, {
                                                    id: cc.id,
                                                    name: cc.title || '雲端賀卡',
                                                    title: cc.title,
                                                    recipient: cc.recipient || '',
                                                    sender: cc.sender || '',
                                                    paragraphs: [cc.description || ''],
                                                    templateId: cc.templateId || 'mothers-day',
                                                    updatedAt: cc.updatedAt ? cc.updatedAt.split('T')[0] : '雲端',
                                                    category: 'personal',
                                                    media: { bgMode: 'slideshow', photos: cc.imageUrl ? [cc.imageUrl] : [] }
                                                });
                                            }
                                        });
                                        return Array.from(map.values());
                                    });
                                }
                            }).catch(() => {});
                        }
                    }
                };
                init();
            }, []);

            const saveCards = (newCards) => {
                setCards(newCards);
                if (window.WorkspaceStore) window.WorkspaceStore.saveCards(newCards);
            };

            const saveTemplates = (newTpls) => {
                setTemplates(newTpls);
                if (window.WorkspaceStore) window.WorkspaceStore.saveTemplates(newTpls);
            };

            const exportAllJSON = () => {
                if (window.WorkspaceStore) {
                    window.WorkspaceStore.exportBackup(cards, templates);
                    showToast('已匯出完整資料備份 (JSON)');
                }
            };

            const handleCloudPublish = async (targetCard) => {
                if (!window.GasClient) {
                    alert('未檢測到 GAS 客戶端模組');
                    return;
                }
                setCloudShareModal({
                    card: targetCard,
                    shareUrl: '',
                    isSaving: true,
                    statusText: '正在同步至 Google Sheets 雲端中央台帳...'
                });

                const res = await window.GasClient.saveCard(targetCard);
                if (res) {
                    if (res.success) {
                        if (res.id && res.id !== targetCard.id) {
                            const updatedCards = cards.map(c => c.id === targetCard.id ? { ...c, id: res.id } : c);
                            saveCards(updatedCards);
                        }
                        setCloudShareModal({
                            card: targetCard,
                            shareUrl: res.shareUrl,
                            isSaving: false,
                            statusText: '發布成功！社群動態預覽已就緒'
                        });
                        showToast('🎉 雲端儲存成功！已生成專屬短連結');
                    } else {
                        setCloudShareModal({
                            card: targetCard,
                            shareUrl: res.fallbackShareUrl || '',
                            isSaving: false,
                            statusText: `已自動為您切換為本機保底連結`
                        });
                        showToast('⚠️ 已切換為本地保底連結');
                    }
                }
            };

            const handleCreateCard = () => {
                if (!window.WorkspaceStore) return;
                const newCard = window.WorkspaceStore.createCard(cards.length, templates);
                const updated = [newCard, ...cards];
                saveCards(updated);
                setEditingCardId(newCard.id);
                setCurrentView('card_editor');
                showToast('已新增卡片並進入所見即所得編輯器！');
            };

            const handleDuplicateCard = (card) => {
                if (!window.WorkspaceStore) return;
                const dup = window.WorkspaceStore.duplicateCard(card);
                const updated = [dup, ...cards];
                saveCards(updated);
                showToast(`已複製卡片「${dup.name}」`);
            };

            const handleDeleteCard = (cardId, cardName) => {
                if (cards.length <= 1) {
                    alert('系統至少保留一張示範卡片！');
                    return;
                }
                if (!window.confirm(`確定要刪除卡片「${cardName}」嗎？`)) return;
                const updated = cards.filter(c => c.id !== cardId);
                saveCards(updated);
                showToast('卡片已刪除');
            };

            const handleCreateTemplate = () => {
                if (!window.WorkspaceStore) return;
                const newTpl = window.WorkspaceStore.createTemplate(templates.length);
                const updated = [...templates, newTpl];
                saveTemplates(updated);
                setEditingTemplate(newTpl);
                setCurrentView('template_editor');
                showToast('已新增模板並進入模板設計工坊！');
            };

            const handleDuplicateTemplate = (tpl) => {
                if (!window.WorkspaceStore) return;
                const dup = window.WorkspaceStore.duplicateTemplate(tpl);
                const updated = [...templates, dup];
                saveTemplates(updated);
                showToast(`已複製模板副本「${dup.name}」`);
            };

            const handleDeleteTemplate = (tplId, tplName) => {
                if (templates.length <= 1) {
                    alert('系統至少保留一個模板！');
                    return;
                }
                if (!window.confirm(`確定要刪除模板「${tplName}」嗎？`)) return;
                const updated = templates.filter(t => t.id !== tplId);
                saveTemplates(updated);
                showToast('模板已刪除');
            };

            const handleSaveTemplate = (updatedTpl) => {
                const updated = templates.map(t => t.id === updatedTpl.id ? updatedTpl : t);
                saveTemplates(updated);
                setEditingTemplate(null);
                setCurrentView('gallery');
                showToast(`模板「${updatedTpl.name}」規格已成功保存！`);
            };

            // 處理使用者選取或拖曳上傳圖片 (WebP 極致壓縮 + ImgBB 直傳)
            const handleImageUpload = async (file) => {
                if (!file) return;
                if (!window.ImageUploader) {
                    alert('未檢測到圖片上傳模組 (ImageUploader)');
                    return;
                }

                setUploadStatus({ isUploading: true, message: '正在啟動圖片處理...' });

                try {
                    const result = await window.ImageUploader.processAndUpload(file, {
                        onProgress: (status) => {
                            setUploadStatus({ isUploading: true, message: status.message });
                        }
                    });

                    // 上傳成功，自動追加到當前編輯卡片的 photos 陣列
                    if (currentEditingCard && result.url) {
                        const currentPhotos = currentEditingCard.media?.photos || [];
                        const updatedPhotos = [...currentPhotos, result.url];
                        updateEditingCard({
                            media: {
                                ...(currentEditingCard.media || {}),
                                photos: updatedPhotos
                            }
                        });
                        showToast(`⚡ 壓縮 ${result.stats.savedPercent}%！已成功新增照片外鏈`);
                    }
                } catch (err) {
                    console.error('上傳照片失敗:', err);
                    alert(`上傳失敗: ${err.message || '連線逾時'}`);
                } finally {
                    setUploadStatus(null);
                    if (fileInputRef.current) fileInputRef.current.value = '';
                }
            };

            const currentEditingCard = cards.find(c => c.id === editingCardId) || cards[0];
            const currentEditingTemplate = templates.find(t => t.id === currentEditingCard?.templateId) || templates[0];

            const updateEditingCard = (fields) => {
                if (!currentEditingCard) return;
                const updated = cards.map(c => c.id === currentEditingCard.id ? { ...c, ...fields } : c);
                saveCards(updated);
            };

            return (
                <div className="min-h-screen flex flex-col bg-[#07080c] text-zinc-200">
                    {toastMessage && (
                        <div className="fixed top-5 left-1/2 -translate-x-1/2 z-50 px-4 py-2 bg-emerald-500 text-zinc-950 font-bold rounded-lg shadow-xl text-xs flex items-center gap-2 animate-bounce">
                            <i className="fa-solid fa-circle-check"></i>
                            <span>{toastMessage}</span>
                        </div>
                    )}

                    {/* 頂部導覽列模組 */}
                    <WorkspaceNavbar
                        currentView={currentView}
                        setCurrentView={setCurrentView}
                        activeGalleryTab={activeGalleryTab}
                        setActiveGalleryTab={setActiveGalleryTab}
                        cardsCount={cards.length}
                        templatesCount={templates.length}
                        editingTemplate={editingTemplate}
                        setEditingTemplate={setEditingTemplate}
                        currentEditingCard={currentEditingCard}
                        editorPreviewDevice={editorPreviewDevice}
                        setEditorPreviewDevice={setEditorPreviewDevice}
                        onSaveTemplate={() => handleSaveTemplate(editingTemplate)}
                        onCloudPublish={() => handleCloudPublish(currentEditingCard)}
                        onExportAllJSON={exportAllJSON}
                    />

                    {/* 首頁大畫廊 (默認進入！) */}
                    {currentView === 'gallery' && (
                        <main className="flex-1 max-w-7xl w-full mx-auto p-6 md:p-8">
                            {activeGalleryTab === 'cards' && (
                                <CardsGallery
                                    cards={cards}
                                    templates={templates}
                                    onCreateCard={handleCreateCard}
                                    onDuplicateCard={handleDuplicateCard}
                                    onDeleteCard={handleDeleteCard}
                                    onPreviewCard={(c, t) => setPreviewModalCard({ card: c, template: t })}
                                    onEditCard={(id) => {
                                        setEditingCardId(id);
                                        setCurrentView('card_editor');
                                    }}
                                    onCloudPublish={handleCloudPublish}
                                />
                            )}

                            {activeGalleryTab === 'templates' && (
                                <TemplatesGallery
                                    templates={templates}
                                    onCreateTemplate={handleCreateTemplate}
                                    onDuplicateTemplate={handleDuplicateTemplate}
                                    onDeleteTemplate={handleDeleteTemplate}
                                    onPreviewTemplate={(t) => setPreviewModalCard({ card: TEMPLATE_DUMMY_CARD, template: t })}
                                    onEditTemplate={(t) => {
                                        setEditingTemplate({ ...t });
                                        setCurrentView('template_editor');
                                    }}
                                />
                            )}
                        </main>
                    )}

                    {/* 卡片編輯器模式 */}
                    {currentView === 'card_editor' && currentEditingCard && (
                        <div className="flex-1 flex overflow-hidden" style={{ height: 'calc(100vh - 56px)' }}>
                            {/* 左欄 */}
                            <aside 
                                style={{ width: '320px', minWidth: '320px', maxWidth: '320px' }}
                                className="border-r border-zinc-800/80 bg-zinc-950/70 p-5 overflow-y-auto custom-scrollbar flex flex-col gap-6 shrink-0 text-xs z-20"
                            >
                                <div>
                                    <h3 className="text-xs font-bold text-amber-300 uppercase tracking-wider mb-1 flex items-center gap-1.5">
                                        <i className="fa-solid fa-sliders"></i>
                                        <span>卡片基本與風格套用</span>
                                    </h3>
                                    <p className="text-[11px] text-zinc-500">修改卡片名稱、分類，並隨選套用外觀模板。</p>
                                </div>

                                <div className="space-y-3 bg-zinc-900/50 p-3 rounded-lg border border-zinc-800">
                                    <div>
                                        <label className="block text-zinc-400 mb-1">內部識別名稱</label>
                                        <input 
                                            type="text"
                                            value={currentEditingCard.name || ''}
                                            onChange={e => updateEditingCard({ name: e.target.value })}
                                            className="w-full bg-zinc-900 border border-zinc-800 rounded px-2.5 py-1.5 text-white outline-none focus:border-amber-400"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-zinc-400 mb-1">卡片分類</label>
                                        <select 
                                            value={currentEditingCard.category || 'personal'}
                                            onChange={e => updateEditingCard({ category: e.target.value })}
                                            className="w-full bg-zinc-900 border border-zinc-800 rounded px-2.5 py-1.5 text-white outline-none focus:border-amber-400 cursor-pointer"
                                        >
                                            <option value="personal">個人親友 (personal)</option>
                                            <option value="business">商務夥伴 (business)</option>
                                            <option value="festive">節慶祝賀 (festive)</option>
                                        </select>
                                    </div>
                                </div>

                                <div className="space-y-2 pt-2 border-t border-zinc-800">
                                    <label className="text-zinc-300 font-semibold flex items-center gap-1.5">
                                        <i className="fa-solid fa-wand-magic-sparkles text-amber-400"></i>
                                        <span>套用外觀模板 (點擊即時套用)</span>
                                    </label>
                                    <div className="grid grid-cols-1 gap-2 max-h-64 overflow-y-auto custom-scrollbar pr-1">
                                        {templates.map(t => {
                                            const isSelected = t.id === currentEditingCard.templateId;
                                            return (
                                                <button
                                                    key={t.id}
                                                    type="button"
                                                    onClick={() => updateEditingCard({ templateId: t.id })}
                                                    className={`w-full text-left p-2.5 rounded-lg border transition-all ${isSelected ? 'border-amber-400 bg-amber-400/10 shadow' : 'border-zinc-800 bg-zinc-900/50 hover:border-zinc-700 hover:bg-zinc-900'}`}
                                                >
                                                    <div className="flex items-center justify-between">
                                                        <span className={`font-bold text-xs ${isSelected ? 'text-amber-300' : 'text-zinc-200'}`}>
                                                            {t.name}
                                                        </span>
                                                        <span className="text-[10px] font-mono px-1.5 py-0.5 rounded bg-zinc-800 text-zinc-400 border border-zinc-700">
                                                            {t.bgShader || 'no-shader'}
                                                        </span>
                                                    </div>
                                                    <div className="text-[10px] text-zinc-400 mt-1 line-clamp-1">
                                                        {t.effects?.particleType || 'none'} · {t.layout}
                                                    </div>
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>

                                <div className="mt-auto pt-3 border-t border-zinc-800 flex items-center justify-between text-[11px] text-zinc-500">
                                    <div className="flex items-center gap-1.5">
                                        <i className="fa-solid fa-cloud text-emerald-400 text-[10px]"></i>
                                        <span>實時自動儲存 (Auto-Saved)</span>
                                    </div>
                                    <span className="text-[10px] text-zinc-600 font-mono">頂部統一操作</span>
                                </div>
                            </aside>

                            {/* 中間 3D 渲染舞台 (100% 徹底淨空，手機居中，上方無任何按鈕重疊) */}
                            <section className="flex-1 bg-black/60 flex items-center justify-center p-4 relative overflow-hidden">
                                <div className={editorPreviewDevice === 'mobile' ? 'phone-frame' : 'desktop-frame'}>
                                    <CardEngine
                                        card={currentEditingCard}
                                        template={currentEditingTemplate}
                                    />
                                </div>
                            </section>

                            {/* 右欄 */}
                            <aside 
                                style={{ width: '380px', minWidth: '380px', maxWidth: '380px' }}
                                className="border-l border-zinc-800/80 bg-zinc-950/70 p-5 overflow-y-auto custom-scrollbar flex flex-col gap-6 shrink-0 text-xs z-20"
                            >
                                <div>
                                    <h3 className="text-xs font-bold text-amber-300 uppercase tracking-wider mb-1 flex items-center gap-1.5">
                                        <i className="fa-solid fa-pen-nib"></i>
                                        <span>專屬賀詞文案與媒體配置</span>
                                    </h3>
                                    <p className="text-[11px] text-zinc-500">修改文字即刻在中間螢幕呈現渲染反饋。</p>
                                </div>

                                <div className="space-y-3 bg-zinc-900/50 p-3 rounded-lg border border-zinc-800">
                                    <div>
                                        <label className="block text-zinc-400 mb-1">主視覺標題 (Title)</label>
                                        <input 
                                            type="text"
                                            value={currentEditingCard.title || ''}
                                            onChange={e => updateEditingCard({ title: e.target.value })}
                                            className="w-full bg-zinc-900 border border-zinc-800 rounded px-2.5 py-1.5 text-white outline-none focus:border-amber-400"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-zinc-400 mb-1">收件人稱謂 (Recipient)</label>
                                        <input 
                                            type="text"
                                            value={currentEditingCard.recipient || ''}
                                            onChange={e => updateEditingCard({ recipient: e.target.value })}
                                            className="w-full bg-zinc-900 border border-zinc-800 rounded px-2.5 py-1.5 text-white outline-none focus:border-amber-400"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-zinc-400 mb-1">落款署名 (Sender / Signature)</label>
                                        <textarea 
                                            rows="2"
                                            value={currentEditingCard.sender || ''}
                                            onChange={e => updateEditingCard({ sender: e.target.value })}
                                            className="w-full bg-zinc-900 border border-zinc-800 rounded px-2.5 py-1.5 text-white outline-none focus:border-amber-400 resize-none font-sans"
                                        />
                                    </div>
                                </div>

                                <div className="space-y-3 bg-zinc-900/50 p-3 rounded-lg border border-zinc-800">
                                    <div className="flex items-center justify-between">
                                        <label className="text-zinc-400 font-medium">祝福段落 ({currentEditingCard.paragraphs?.length || 0})</label>
                                        <button
                                            type="button"
                                            onClick={() => {
                                                const p = [...(currentEditingCard.paragraphs || []), '在此輸入新的感心賀詞...'];
                                                updateEditingCard({ paragraphs: p });
                                            }}
                                            className="text-amber-400 hover:text-amber-300 text-[11px] flex items-center gap-1"
                                        >
                                            <i className="fa-solid fa-plus text-[10px]"></i>
                                            <span>增加段落</span>
                                        </button>
                                    </div>
                                    {(currentEditingCard.paragraphs || []).map((para, idx) => (
                                        <div key={idx} className="relative group">
                                            <textarea
                                                rows="3"
                                                value={para}
                                                onChange={e => {
                                                    const updatedP = [...currentEditingCard.paragraphs];
                                                    updatedP[idx] = e.target.value;
                                                    updateEditingCard({ paragraphs: updatedP });
                                                }}
                                                className="w-full bg-zinc-900 border border-zinc-800 rounded p-2 text-white outline-none focus:border-amber-400 text-xs resize-y"
                                            />
                                            {currentEditingCard.paragraphs.length > 1 && (
                                                <button
                                                    type="button"
                                                    onClick={() => {
                                                        const updatedP = currentEditingCard.paragraphs.filter((_, i) => i !== idx);
                                                        updateEditingCard({ paragraphs: updatedP });
                                                    }}
                                                    className="absolute top-2 right-2 p-1 text-zinc-500 hover:text-rose-400 transition-colors opacity-0 group-hover:opacity-100"
                                                    title="刪除此段落"
                                                >
                                                    <i className="fa-regular fa-trash-can text-[10px]"></i>
                                                </button>
                                            )}
                                        </div>
                                    ))}
                                </div>

                                <div className="space-y-3 bg-zinc-900/50 p-3 rounded-lg border border-zinc-800">
                                    <div className="flex items-center justify-between">
                                        <div className="flex items-center gap-1.5">
                                            <label className="text-zinc-300 font-medium">背景相片展示</label>
                                            <span className={`text-[10px] px-1.5 py-0.5 rounded font-mono ${
                                                (currentEditingCard.media?.photos || []).length <= 1 
                                                    ? 'bg-emerald-950/60 text-emerald-400 border border-emerald-800/40' 
                                                    : 'bg-amber-950/60 text-amber-400 border border-amber-800/40'
                                            }`}>
                                                {(currentEditingCard.media?.photos || []).length <= 1 ? '單張·Ken Burns慢鏡' : `${(currentEditingCard.media?.photos || []).length}張·5s輪播`}
                                            </span>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <button
                                                type="button"
                                                onClick={() => {
                                                    const currentPhotos = currentEditingCard.media?.photos || [];
                                                    const updatedPhotos = [...currentPhotos, 'https://images.unsplash.com/photo-1518895949257-7621c3c786d7?auto=format&fit=crop&w=1200&q=80'];
                                                    updateEditingCard({ media: { ...(currentEditingCard.media || {}), photos: updatedPhotos } });
                                                }}
                                                className="text-zinc-400 hover:text-zinc-300 text-[11px] flex items-center gap-1"
                                                title="手動輸入照片網址"
                                            >
                                                <i className="fa-solid fa-plus text-[10px]"></i>
                                                <span>加外鏈</span>
                                            </button>
                                            <button
                                                type="button"
                                                disabled={uploadStatus?.isUploading}
                                                onClick={() => fileInputRef.current?.click()}
                                                className="text-amber-400 hover:text-amber-300 bg-amber-400/10 hover:bg-amber-400/20 border border-amber-400/30 px-2 py-0.5 rounded text-[11px] flex items-center gap-1 transition-colors"
                                                title="極速壓縮轉 WebP 並直傳 ImgBB"
                                            >
                                                <i className="fa-solid fa-cloud-arrow-up text-[10px]"></i>
                                                <span>上傳照片</span>
                                            </button>
                                        </div>
                                    </div>

                                    {/* 隱藏的 File Input */}
                                    <input 
                                        type="file" 
                                        ref={fileInputRef} 
                                        accept="image/*" 
                                        className="hidden" 
                                        onChange={e => {
                                            if (e.target.files && e.target.files[0]) {
                                                handleImageUpload(e.target.files[0]);
                                            }
                                        }} 
                                    />

                                    {/* 圖片上傳拖曳提示框 */}
                                    <div 
                                        onDragOver={e => { e.preventDefault(); e.stopPropagation(); }}
                                        onDrop={e => {
                                            e.preventDefault();
                                            e.stopPropagation();
                                            if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                                                handleImageUpload(e.dataTransfer.files[0]);
                                            }
                                        }}
                                        onClick={() => !uploadStatus?.isUploading && fileInputRef.current?.click()}
                                        className="border border-dashed border-zinc-700/80 hover:border-amber-400/60 bg-zinc-950/40 hover:bg-zinc-950/70 rounded-lg p-2.5 text-center cursor-pointer transition-all flex flex-col items-center justify-center gap-1"
                                    >
                                        {uploadStatus?.isUploading ? (
                                            <div className="flex items-center gap-2 text-amber-400 font-medium py-1">
                                                <i className="fa-solid fa-circle-notch fa-spin text-xs"></i>
                                                <span>{uploadStatus.message}</span>
                                            </div>
                                        ) : (
                                            <>
                                                <div className="flex items-center gap-1.5 text-zinc-400 text-[11px]">
                                                    <i className="fa-regular fa-image text-amber-400"></i>
                                                    <span>拖曳圖片至此，或點擊選圖上傳</span>
                                                </div>
                                                <div className="text-[10px] text-zinc-500">
                                                    ⚡ 自動等比縮放 + WebP 80% 極致壓縮 ➔ 免塞 Git 直出 CDN 外鏈
                                                </div>
                                            </>
                                        )}
                                    </div>

                                    {/* 照片網址清單 */}
                                    {(currentEditingCard.media?.photos || []).map((photoUrl, idx) => (
                                        <div key={idx} className="flex items-center gap-2 bg-zinc-950/60 p-1.5 rounded border border-zinc-800/80">
                                            <img 
                                                src={photoUrl} 
                                                alt={`相片 ${idx + 1}`} 
                                                className="w-7 h-7 object-cover rounded border border-zinc-700 shrink-0" 
                                                onError={(e) => { e.target.style.display = 'none'; }}
                                            />
                                            <input
                                                type="text"
                                                value={photoUrl}
                                                onChange={e => {
                                                    const updatedPhotos = [...currentEditingCard.media.photos];
                                                    updatedPhotos[idx] = e.target.value;
                                                    updateEditingCard({ media: { ...currentEditingCard.media, photos: updatedPhotos } });
                                                }}
                                                className="flex-1 bg-zinc-900 border border-zinc-800 rounded px-2 py-1 text-[11px] text-white outline-none focus:border-amber-400 font-mono"
                                                placeholder="https://..."
                                            />
                                            <button
                                                type="button"
                                                onClick={() => {
                                                    const updatedPhotos = currentEditingCard.media.photos.filter((_, i) => i !== idx);
                                                    updateEditingCard({ media: { ...currentEditingCard.media, photos: updatedPhotos } });
                                                }}
                                                className="p-1.5 text-zinc-500 hover:text-rose-400 transition-colors shrink-0"
                                                title="移除相片"
                                            >
                                                <i className="fa-regular fa-trash-can text-[10px]"></i>
                                            </button>
                                        </div>
                                    ))}
                                </div>

                                <div className="bg-zinc-900/50 p-3 rounded-lg border border-zinc-800 space-y-2">
                                    <label className="block text-zinc-400 font-medium">背景配樂 (Audio URL / 相對路徑)</label>
                                    <input
                                        type="text"
                                        value={currentEditingCard.media?.customMusic || ''}
                                        placeholder="預設使用模板配樂 (可填 assets/audio/In Love With You.mp3)"
                                        onChange={e => {
                                            updateEditingCard({
                                                media: { ...(currentEditingCard.media || {}), customMusic: e.target.value }
                                            });
                                        }}
                                        className="w-full bg-zinc-900 border border-zinc-800 rounded px-2.5 py-1.5 text-white outline-none focus:border-amber-400 font-mono text-[11px]"
                                    />
                                </div>
                            </aside>
                        </div>
                    )}

                    {/* 模板設計工坊模式 (全螢幕所見即所得實時預覽，完全對齊圖1卡片編輯器風格) */}
                    {currentView === 'template_editor' && editingTemplate && (
                        <div className="flex-1 flex overflow-hidden" style={{ height: 'calc(100vh - 56px)' }}>
                            {/* 左欄 (320px): 模板基本與版型架構 */}
                            <aside 
                                style={{ width: '320px', minWidth: '320px', maxWidth: '320px' }}
                                className="border-r border-zinc-800/80 bg-zinc-950/70 p-5 overflow-y-auto custom-scrollbar flex flex-col gap-6 shrink-0 text-xs z-20"
                            >
                                <div>
                                    <h3 className="text-xs font-bold text-indigo-400 uppercase tracking-wider mb-1 flex items-center gap-1.5">
                                        <i className="fa-solid fa-sliders"></i>
                                        <span>模板基本與版型架構</span>
                                    </h3>
                                    <p className="text-[11px] text-zinc-500">調整模板識別名稱、版型佈局與文字字型風格。</p>
                                </div>

                                <div className="space-y-3 bg-zinc-900/50 p-3 rounded-lg border border-zinc-800">
                                    <div>
                                        <label className="block text-zinc-400 mb-1">模板識別名稱</label>
                                        <input 
                                            type="text"
                                            value={editingTemplate.name || ''}
                                            onChange={e => setEditingTemplate({ ...editingTemplate, name: e.target.value })}
                                            className="w-full bg-zinc-900 border border-zinc-800 rounded px-2.5 py-1.5 text-white outline-none focus:border-indigo-400 font-medium"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-zinc-400 mb-1">版型佈局架構 (Layout)</label>
                                        <select
                                            value={editingTemplate.layout || 'star-wars-crawl'}
                                            onChange={e => setEditingTemplate({ ...editingTemplate, layout: e.target.value })}
                                            className="w-full bg-zinc-900 border border-zinc-800 rounded px-2.5 py-1.5 text-white outline-none focus:border-indigo-400 cursor-pointer"
                                        >
                                            {(window.LAYOUT_OPTIONS || []).map(opt => (
                                                <option key={opt.value} value={opt.value}>{opt.label}</option>
                                            ))}
                                        </select>
                                    </div>
                                    {editingTemplate.layout === 'star-wars-crawl' && (
                                        <div>
                                            <div className="flex items-center justify-between mb-1">
                                                <label className="text-zinc-400">字幕漫遊升空速度 (Speed)</label>
                                                <span className="font-mono text-indigo-400 font-bold">{editingTemplate.crawlSpeed || 44}s</span>
                                            </div>
                                            <input 
                                                type="range"
                                                min="20"
                                                max="80"
                                                value={editingTemplate.crawlSpeed || 44}
                                                onChange={e => setEditingTemplate({ ...editingTemplate, crawlSpeed: parseInt(e.target.value) || 40 })}
                                                className="w-full accent-indigo-500 cursor-pointer"
                                            />
                                            <div className="flex justify-between text-[10px] text-zinc-500 mt-1 font-mono">
                                                <span>20s (疾速)</span>
                                                <span>44s (優雅)</span>
                                                <span>80s (深情)</span>
                                            </div>
                                        </div>
                                    )}

                                    {/* 滿版海報專屬：4 大文字入場動態特效選單 */}
                                    {(editingTemplate.layout === 'cinematic-poster' || editingTemplate.layout === 'fixed-card' || editingTemplate.layout === 'boxed-card') && (
                                        <div className="space-y-2 pt-1 border-t border-zinc-800/60">
                                            <div className="flex items-center justify-between">
                                                <label className="text-zinc-400 text-[11px] font-medium">海報文字入場動效 (Reveal FX)</label>
                                                <button
                                                    type="button"
                                                    onClick={() => {
                                                        const curFx = editingTemplate.textRevealFx || 'domino-3d';
                                                        setEditingTemplate({ ...editingTemplate, textRevealFx: '' });
                                                        setTimeout(() => {
                                                            setEditingTemplate({ ...editingTemplate, textRevealFx: curFx });
                                                        }, 50);
                                                    }}
                                                    className="px-2 py-0.5 rounded bg-zinc-800 hover:bg-zinc-700 text-[10px] text-indigo-300 flex items-center gap-1 transition-all"
                                                    title="重新播放文字入場特效"
                                                >
                                                    <i className="fa-solid fa-rotate-right text-[9px]"></i>
                                                    <span>重播動效</span>
                                                </button>
                                            </div>
                                            <select
                                                value={editingTemplate.textRevealFx || 'domino-3d'}
                                                onChange={e => setEditingTemplate({ ...editingTemplate, textRevealFx: e.target.value })}
                                                className="w-full bg-zinc-900 border border-zinc-800 rounded px-2.5 py-1.5 text-white font-mono text-[11px] outline-none focus:border-indigo-400 cursor-pointer"
                                            >
                                                {(window.TEXT_REVEAL_OPTIONS || []).map(opt => (
                                                    <option key={opt.value} value={opt.value}>{opt.label}</option>
                                                ))}
                                            </select>
                                            <p className="text-[10px] text-zinc-500">受眾點開賀卡瞬間，文字層次登場之動態儀式感。</p>
                                        </div>
                                    )}
                                </div>

                                <div className="space-y-3 bg-zinc-900/50 p-3 rounded-lg border border-zinc-800">
                                    <div>
                                        <label className="block text-zinc-400 mb-1">模板簡介說明</label>
                                        <textarea
                                            rows="3"
                                            value={editingTemplate.description || ''}
                                            onChange={e => setEditingTemplate({ ...editingTemplate, description: e.target.value })}
                                            className="w-full bg-zinc-900 border border-zinc-800 rounded p-2 text-white outline-none focus:border-indigo-400 leading-relaxed"
                                            placeholder="描述此模板的意境與推薦使用場合..."
                                        />
                                    </div>
                                </div>

                                <div className="p-3 bg-indigo-950/30 rounded-lg border border-indigo-800/30 text-[11px] text-indigo-200/80 space-y-1">
                                    <div className="font-bold flex items-center gap-1 text-indigo-300">
                                        <i className="fa-solid fa-circle-info"></i>
                                        <span>即時 3D 所見即所得</span>
                                    </div>
                                    <p>在左側與右側調整任何數值，中間螢幕會以 60 FPS 實時呈現 Shader 與粒子演算光影。</p>
                                </div>

                                <div className="mt-auto pt-3 border-t border-zinc-800 flex items-center justify-between text-[11px] text-zinc-500">
                                    <div className="flex items-center gap-1.5">
                                        <i className="fa-solid fa-circle-check text-indigo-400 text-[10px]"></i>
                                        <span>即時預覽中</span>
                                    </div>
                                    <span className="text-[10px] text-zinc-600 font-mono">頂部統一保存</span>
                                </div>
                            </aside>

                            {/* 中間大畫布 (100% 徹底淨空，手機居中，上方無任何按鈕重疊) */}
                            <section className="flex-1 bg-black/60 flex items-center justify-center p-4 relative overflow-hidden">
                                <div className={editorPreviewDevice === 'mobile' ? 'phone-frame' : 'desktop-frame'}>
                                    <CardEngine
                                        card={window.TEMPLATE_DUMMY_CARD}
                                        template={editingTemplate}
                                    />
                                </div>
                            </section>

                            {/* 右欄 (380px): 3D 視覺特效與風格色彩 */}
                            <aside 
                                style={{ width: '380px', minWidth: '380px', maxWidth: '380px' }}
                                className="border-l border-zinc-800/80 bg-zinc-950/70 p-5 overflow-y-auto custom-scrollbar flex flex-col gap-6 shrink-0 text-xs z-20"
                            >
                                <div>
                                    <h3 className="text-xs font-bold text-indigo-400 uppercase tracking-wider mb-1 flex items-center gap-1.5">
                                        <i className="fa-solid fa-wand-magic-sparkles"></i>
                                        <span>3D 視覺特效與風格色彩</span>
                                    </h3>
                                    <p className="text-[11px] text-zinc-500">修改數值即刻在中間螢幕呈現渲染反饋。</p>
                                </div>

                                <div className="space-y-3 bg-zinc-900/50 p-3 rounded-lg border border-zinc-800">
                                    <div>
                                        <label className="block text-zinc-400 mb-1">背景 3D WebGL Shader</label>
                                        <select
                                            value={editingTemplate.bgShader || 'none'}
                                            onChange={e => setEditingTemplate({ ...editingTemplate, bgShader: e.target.value })}
                                            className="w-full bg-zinc-900 border border-zinc-800 rounded px-2.5 py-1.5 text-white font-mono outline-none focus:border-indigo-400 cursor-pointer"
                                        >
                                            {(window.SHADER_OPTIONS || []).map(opt => (
                                                <option key={opt.value} value={opt.value}>{opt.label}</option>
                                            ))}
                                        </select>
                                    </div>

                                    {/* 背景 Shader 多維微調（非 none 時展示） */}
                                    {editingTemplate.bgShader && editingTemplate.bgShader !== 'none' && (
                                        <div className="space-y-2.5 pt-1 border-t border-zinc-800/60">
                                            <div>
                                                <div className="flex items-center justify-between mb-1">
                                                    <label className="text-zinc-400 text-[11px]">背景輝光濃淡 (Opacity)</label>
                                                    <span className="font-mono text-indigo-400 font-bold">{Math.round((editingTemplate.bgShaderOpacity !== undefined ? editingTemplate.bgShaderOpacity : 0.85) * 100)}%</span>
                                                </div>
                                                <input 
                                                    type="range"
                                                    min="20"
                                                    max="100"
                                                    value={Math.round((editingTemplate.bgShaderOpacity !== undefined ? editingTemplate.bgShaderOpacity : 0.85) * 100)}
                                                    onChange={e => setEditingTemplate({
                                                        ...editingTemplate,
                                                        bgShaderOpacity: parseFloat(e.target.value) / 100
                                                    })}
                                                    className="w-full accent-indigo-500 cursor-pointer"
                                                />
                                            </div>

                                            <div>
                                                <div className="flex items-center justify-between mb-1">
                                                    <label className="text-zinc-400 text-[11px]">3D 動態流速 (Speed)</label>
                                                    <span className="font-mono text-indigo-400 font-bold">{(editingTemplate.bgShaderSpeed !== undefined ? editingTemplate.bgShaderSpeed : 1.0).toFixed(1)}x</span>
                                                </div>
                                                <input 
                                                    type="range"
                                                    min="2"
                                                    max="20"
                                                    value={Math.round((editingTemplate.bgShaderSpeed !== undefined ? editingTemplate.bgShaderSpeed : 1.0) * 10)}
                                                    onChange={e => setEditingTemplate({
                                                        ...editingTemplate,
                                                        bgShaderSpeed: parseFloat(e.target.value) / 10
                                                    })}
                                                    className="w-full accent-indigo-500 cursor-pointer"
                                                />
                                                <div className="flex justify-between text-[9px] text-zinc-500 font-mono">
                                                    <span>0.2x (極緩)</span>
                                                    <span>1.0x (標準)</span>
                                                    <span>2.0x (流暢)</span>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <div className="space-y-3 bg-zinc-900/50 p-3 rounded-lg border border-zinc-800">
                                    <div>
                                        <label className="block text-zinc-400 mb-1">3D 前景粒子特效群 (Particles)</label>
                                        <select
                                            value={editingTemplate.effects?.particleType || 'none'}
                                            onChange={e => setEditingTemplate({
                                                ...editingTemplate,
                                                effects: { ...(editingTemplate.effects || {}), particleType: e.target.value }
                                            })}
                                            className="w-full bg-zinc-900 border border-zinc-800 rounded px-2.5 py-1.5 text-white font-mono outline-none focus:border-indigo-400 cursor-pointer"
                                        >
                                            {(window.PARTICLE_OPTIONS || []).map(opt => (
                                                <option key={opt.value} value={opt.value}>{opt.label}</option>
                                            ))}
                                        </select>
                                    </div>

                                    {/* 前景粒子三維微調（非 none 時展示） */}
                                    {editingTemplate.effects?.particleType && editingTemplate.effects?.particleType !== 'none' && (
                                        <div className="space-y-2.5 pt-1 border-t border-zinc-800/60">
                                            <div>
                                                <div className="flex items-center justify-between mb-1">
                                                    <label className="text-zinc-400 text-[11px]">粒子發射密度 (Density)</label>
                                                    <span className="font-mono text-indigo-400 font-bold">{editingTemplate.effects?.particleDensity || 30}</span>
                                                </div>
                                                <input 
                                                    type="range"
                                                    min="10"
                                                    max="80"
                                                    value={editingTemplate.effects?.particleDensity || 30}
                                                    onChange={e => setEditingTemplate({
                                                        ...editingTemplate,
                                                        effects: { ...(editingTemplate.effects || {}), particleDensity: parseInt(e.target.value) || 30 }
                                                    })}
                                                    className="w-full accent-indigo-500 cursor-pointer"
                                                />
                                            </div>

                                            <div>
                                                <div className="flex items-center justify-between mb-1">
                                                    <label className="text-zinc-400 text-[11px]">粒子透明度 (Opacity)</label>
                                                    <span className="font-mono text-indigo-400 font-bold">{Math.round((editingTemplate.effects?.particleOpacity !== undefined ? editingTemplate.effects?.particleOpacity : 0.8) * 100)}%</span>
                                                </div>
                                                <input 
                                                    type="range"
                                                    min="20"
                                                    max="100"
                                                    value={Math.round((editingTemplate.effects?.particleOpacity !== undefined ? editingTemplate.effects?.particleOpacity : 0.8) * 100)}
                                                    onChange={e => setEditingTemplate({
                                                        ...editingTemplate,
                                                        effects: { ...(editingTemplate.effects || {}), particleOpacity: parseFloat(e.target.value) / 100 }
                                                    })}
                                                    className="w-full accent-indigo-500 cursor-pointer"
                                                />
                                            </div>

                                            <div>
                                                <div className="flex items-center justify-between mb-1">
                                                    <label className="text-zinc-400 text-[11px]">飄落/升騰速度 (Speed)</label>
                                                    <span className="font-mono text-indigo-400 font-bold">{(editingTemplate.effects?.particleSpeed !== undefined ? editingTemplate.effects?.particleSpeed : 1.0).toFixed(1)}x</span>
                                                </div>
                                                <input 
                                                    type="range"
                                                    min="4"
                                                    max="20"
                                                    value={Math.round((editingTemplate.effects?.particleSpeed !== undefined ? editingTemplate.effects?.particleSpeed : 1.0) * 10)}
                                                    onChange={e => setEditingTemplate({
                                                        ...editingTemplate,
                                                        effects: { ...(editingTemplate.effects || {}), particleSpeed: parseFloat(e.target.value) / 10 }
                                                    })}
                                                    className="w-full accent-indigo-500 cursor-pointer"
                                                />
                                                <div className="flex justify-between text-[9px] text-zinc-500 font-mono">
                                                    <span>0.4x (慢速)</span>
                                                    <span>1.0x (標準)</span>
                                                    <span>2.0x (歡慶)</span>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <div className="space-y-3 bg-zinc-900/50 p-3 rounded-lg border border-zinc-800">
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-zinc-400 mb-1">主色調 (Primary)</label>
                                            <div className="flex items-center gap-2">
                                                <input
                                                    type="color"
                                                    value={editingTemplate.theme?.primaryColor || '#c9a96e'}
                                                    onChange={e => setEditingTemplate({
                                                        ...editingTemplate,
                                                        theme: { ...(editingTemplate.theme || {}), primaryColor: e.target.value }
                                                    })}
                                                    className="w-8 h-8 rounded border border-zinc-700 bg-transparent cursor-pointer"
                                                />
                                                <input
                                                    type="text"
                                                    value={editingTemplate.theme?.primaryColor || '#c9a96e'}
                                                    onChange={e => setEditingTemplate({
                                                        ...editingTemplate,
                                                        theme: { ...(editingTemplate.theme || {}), primaryColor: e.target.value }
                                                    })}
                                                    className="w-full bg-zinc-900 border border-zinc-800 rounded px-2 py-1 text-white font-mono text-[11px]"
                                                />
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-zinc-400 mb-1">強調色 (Accent)</label>
                                            <div className="flex items-center gap-2">
                                                <input
                                                    type="color"
                                                    value={editingTemplate.theme?.accentColor || '#fbbf24'}
                                                    onChange={e => setEditingTemplate({
                                                        ...editingTemplate,
                                                        theme: { ...(editingTemplate.theme || {}), accentColor: e.target.value }
                                                    })}
                                                    className="w-8 h-8 rounded border border-zinc-700 bg-transparent cursor-pointer"
                                                />
                                                <input
                                                    type="text"
                                                    value={editingTemplate.theme?.accentColor || '#fbbf24'}
                                                    onChange={e => setEditingTemplate({
                                                        ...editingTemplate,
                                                        theme: { ...(editingTemplate.theme || {}), accentColor: e.target.value }
                                                    })}
                                                    className="w-full bg-zinc-900 border border-zinc-800 rounded px-2 py-1 text-white font-mono text-[11px]"
                                                />
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </aside>
                        </div>
                    )}

                    {/* 模組化彈窗 */}
                    <PreviewModal
                        modalCard={previewModalCard}
                        onClose={() => setPreviewModalCard(null)}
                        onCloudPublish={handleCloudPublish}
                    />

                    <CloudShareModal
                        shareModal={cloudShareModal}
                        onClose={() => setCloudShareModal(null)}
                        onShowToast={showToast}
                    />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CardForgeApp />);
    </script>
</body>
</html>
