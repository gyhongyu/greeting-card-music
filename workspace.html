<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardForge Studio - 所見即所得賀卡與模板工坊</title>

    <!-- Fonts & Tailwind -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Jost:wght@300;400;500;600;700&family=Noto+Serif+TC:wght@300;400;600&family=Noto+Sans+TC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <!-- Three.js (For Live Preview) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- React & Babel -->
    <script src="https://resource.trickle.so/vendor_lib/unpkg/react@18/umd/react.production.min.js"></script>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/@babel/standalone/babel.min.js"></script>

    <!-- Custom Styles (純 CSS 無 CORS 限制) -->
    <link href="styles/animations.css" rel="stylesheet">
    <link href="styles/templates.css" rel="stylesheet">
    <link href="css/workspace.css" rel="stylesheet">
</head>
<body class="bg-[#08090d] text-zinc-200">
    <div id="root"></div>

    <!-- Configuration & Pure JS (原生載入無 CORS 限制) -->
    <script src="core/BackdropShader.js"></script>
    <script src="core/ParticleEngine.js"></script>
    <script src="core/CardEngine.js"></script>
    <script src="js/constants.js"></script>
    <script src="js/config.js"></script>
    <script src="js/gas_client.js"></script>
    <script src="js/workspace_store.js"></script>
    <script src="js/image_uploader.js"></script>
    <script src="js/workspace_views.js"></script>
    <script src="js/editor_views.js"></script>

    <!-- 
      重要說明：
      在 file:/// 協議下，Babel 無法透過 XHR 讀取外部 JSX 檔案 (會被 Chrome CORS 阻擋)。
      純 JS 模組 (ParticleEngine, constants, config, gas_client, workspace_views, editor_views) 走原生 script 標籤載入，
      頂層 React 視圖路由維持內聯，保證 100% 模組化且零伺服器本機雙擊秒開！
    -->
    <script type="text/babel">
        // 引用外部已模組化的核心渲染舞台 (core/CardEngine.js)
        // 解構外部純 JS 模組化視圖組件 (js/workspace_views.js & js/editor_views.js)
        const {
            PreviewModal,
            CloudShareModal,
            WorkspaceNavbar,
            CardsGallery,
            TemplatesGallery,
            PasswordLockGate
        } = window.WorkspaceViews;

        const {
            CardEditorView,
            TemplateEditorView
        } = window.EditorViews;

        // =========================================================================
        // 5. WORKSPACE APP (創作者工坊主體)
        // =========================================================================
        const TEMPLATE_DUMMY_CARD = window.TEMPLATE_DUMMY_CARD;

        function CardForgeApp() {
            const [isUnlocked, setIsUnlocked] = React.useState(() => {
                try { return localStorage.getItem('cardforge_auth_unlocked') === 'true'; } catch (e) { return false; }
            });
            const [currentView, setCurrentView] = React.useState('gallery'); // 'gallery' | 'card_editor' | 'template_editor'
            const [activeGalleryTab, setActiveGalleryTab] = React.useState('cards');
            const [cards, setCards] = React.useState([]);
            const [templates, setTemplates] = React.useState([]);
            const [editingCardId, setEditingCardId] = React.useState(null);
            const [editingTemplate, setEditingTemplate] = React.useState(null);

            const [previewModalCard, setPreviewModalCard] = React.useState(null);
            const [cloudShareModal, setCloudShareModal] = React.useState(null);
            const [editorPreviewDevice, setEditorPreviewDevice] = React.useState('mobile');
            const [toastMessage, setToastMessage] = React.useState('');
            const [uploadStatus, setUploadStatus] = React.useState(null);
            const [posterAutoLoop, setPosterAutoLoop] = React.useState(false);
            const [posterLoopInterval, setPosterLoopInterval] = React.useState(8);
            const [syncStatus, setSyncStatus] = React.useState('synced');
            const fileInputRef = React.useRef(null);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 3000);
            };

            // 監聽 WorkspaceStore 背景差異同步狀態
            React.useEffect(() => {
                if (window.WorkspaceStore) {
                    window.WorkspaceStore.onSyncStatusChange(status => setSyncStatus(status));
                }
            }, []);

            // 自動定時循環重播海報文字動態特效 (支援模板工坊與卡片編輯器即時動態預覽)
            React.useEffect(() => {
                if (!posterAutoLoop) return;
                const isTemplateMode = currentView === 'template_editor' && editingTemplate;
                const isCardMode = currentView === 'card_editor' && currentEditingTemplate;
                if (!isTemplateMode && !isCardMode) return;

                const timer = setInterval(() => {
                    if (isTemplateMode) {
                        setEditingTemplate(prev => prev ? { ...prev, replayKey: Date.now() } : null);
                    } else if (isCardMode) {
                        setTemplates(prevTpls => prevTpls.map(t => t.id === currentEditingTemplate.id ? { ...t, replayKey: Date.now() } : t));
                    }
                }, posterLoopInterval * 1000);
                return () => clearInterval(timer);
            }, [posterAutoLoop, posterLoopInterval, currentView, editingTemplate?.id, currentEditingTemplate?.id]);

            React.useEffect(() => {
                const init = async () => {
                    if (window.WorkspaceStore) {
                        const { cards: initCards, templates: initTpls } = await window.WorkspaceStore.loadInitialData();
                        setCards(initCards);
                        setTemplates(initTpls);

                        if (window.GasClient) {
                            window.GasClient.listCards().then(cloudList => {
                                if (cloudList && cloudList.length > 0) {
                                    setCards(prevCards => {
                                        const map = new Map(prevCards.map(c => [c.id, c]));
                                        cloudList.forEach(cc => {
                                            if (!map.has(cc.id)) {
                                                map.set(cc.id, {
                                                    id: cc.id,
                                                    name: cc.title || '雲端賀卡',
                                                    title: cc.title,
                                                    recipient: cc.recipient || '',
                                                    sender: cc.sender || '',
                                                    paragraphs: [cc.description || ''],
                                                    templateId: cc.templateId || 'mothers-day',
                                                    updatedAt: cc.updatedAt ? cc.updatedAt.split('T')[0] : '雲端',
                                                    category: 'personal',
                                                    media: { bgMode: 'slideshow', photos: cc.imageUrl ? [cc.imageUrl] : [] }
                                                });
                                            }
                                        });
                                        return Array.from(map.values());
                                    });
                                }
                            }).catch(() => {});

                            window.GasClient.listTemplates().then(cloudTpls => {
                                if (cloudTpls && cloudTpls.length > 0) {
                                    setTemplates(prevTpls => {
                                        const map = new Map(prevTpls.map(t => [t.id, t]));
                                        cloudTpls.forEach(ct => {
                                            map.set(ct.id, { ...(map.get(ct.id) || {}), ...ct });
                                        });
                                        return Array.from(map.values());
                                    });
                                }
                            }).catch(() => {});
                        }
                    }
                };
                init();
            }, []);

            const saveCards = (newCards, changedId) => {
                setCards(newCards);
                if (window.WorkspaceStore) window.WorkspaceStore.saveCards(newCards, changedId);
            };

            const saveTemplates = (newTpls, changedId) => {
                setTemplates(newTpls);
                if (window.WorkspaceStore) window.WorkspaceStore.saveTemplates(newTpls, changedId);
            };

            const exportAllJSON = () => {
                if (window.WorkspaceStore) {
                    window.WorkspaceStore.exportBackup(cards, templates);
                    showToast('已匯出完整資料備份 (JSON)');
                }
            };

            const handleCloudPublish = (targetCard) => {
                if (!targetCard) return;
                const baseShare = window.CardForgeConfig?.SHARE_BASE_URL || window.CardForgeConfig?.FALLBACK_SHARE_URL || 'https://card.teaforia.in';
                const shareUrl = `${baseShare}?id=${encodeURIComponent(targetCard.id)}`;

                setCloudShareModal({
                    card: targetCard,
                    shareUrl: shareUrl,
                    isSaving: false,
                    statusText: '背景差異增量同步已生效'
                });

                // 立即觸發未發送的增量同步，保證雲端 SSOT 資料完整無損
                if (window.WorkspaceStore) {
                    window.WorkspaceStore.forceSyncNow(cards, templates);
                }
            };

            const handleCreateCard = () => {
                if (!window.WorkspaceStore) return;
                const newCard = window.WorkspaceStore.createCard(cards.length, templates);
                const updated = [newCard, ...cards];
                saveCards(updated);
                setEditingCardId(newCard.id);
                setCurrentView('card_editor');
                showToast('已新增卡片並進入所見即所得編輯器！');
            };

            const handleDuplicateCard = (card) => {
                if (!window.WorkspaceStore) return;
                const dup = window.WorkspaceStore.duplicateCard(card);
                const updated = [dup, ...cards];
                saveCards(updated);
                showToast(`已複製卡片「${dup.name}」`);
            };

            const handleDeleteCard = (cardId, cardName) => {
                if (cards.length <= 1) {
                    alert('系統至少保留一張示範卡片！');
                    return;
                }
                if (!window.confirm(`確定要刪除卡片「${cardName}」嗎？`)) return;
                const updated = cards.filter(c => c.id !== cardId);
                saveCards(updated);
                showToast('卡片已刪除');
            };

            const handleCreateTemplate = () => {
                if (!window.WorkspaceStore) return;
                const newTpl = window.WorkspaceStore.createTemplate(templates.length);
                const updated = [...templates, newTpl];
                saveTemplates(updated);
                setEditingTemplate(newTpl);
                setCurrentView('template_editor');
                showToast('已新增模板並進入模板設計工坊！');
            };

            const handleDuplicateTemplate = (tpl) => {
                if (!window.WorkspaceStore) return;
                const dup = window.WorkspaceStore.duplicateTemplate(tpl);
                const updated = [...templates, dup];
                saveTemplates(updated);
                showToast(`已複製模板副本「${dup.name}」`);
            };

            const handleDeleteTemplate = (tplId, tplName) => {
                if (templates.length <= 1) {
                    alert('系統至少保留一個模板！');
                    return;
                }
                if (!window.confirm(`確定要刪除模板「${tplName}」嗎？`)) return;
                const updated = templates.filter(t => t.id !== tplId);
                saveTemplates(updated);
                showToast('模板已刪除');
            };

            const handleSaveTemplate = (updatedTpl) => {
                const updated = templates.map(t => t.id === updatedTpl.id ? updatedTpl : t);
                saveTemplates(updated, updatedTpl.id);
                setEditingTemplate(null);
                setCurrentView('gallery');
                showToast(`模板「${updatedTpl.name}」規格已保存並自動同步雲端！`);
            };

            // 處理使用者選取或拖曳上傳圖片 (WebP 極致壓縮 + ImgBB 直傳)
            const handleImageUpload = async (file) => {
                if (!file) return;
                if (!window.ImageUploader) {
                    alert('未檢測到圖片上傳模組 (ImageUploader)');
                    return;
                }

                setUploadStatus({ isUploading: true, message: '正在啟動圖片處理...' });

                try {
                    const result = await window.ImageUploader.processAndUpload(file, {
                        onProgress: (status) => {
                            setUploadStatus({ isUploading: true, message: status.message });
                        }
                    });

                    // 上傳成功，自動追加到當前編輯卡片的 photos 陣列
                    if (currentEditingCard && result.url) {
                        const currentPhotos = currentEditingCard.media?.photos || [];
                        const updatedPhotos = [...currentPhotos, result.url];
                        updateEditingCard({
                            media: {
                                ...(currentEditingCard.media || {}),
                                photos: updatedPhotos
                            }
                        });
                        showToast(`⚡ 壓縮 ${result.stats.savedPercent}%！已成功新增照片外鏈`);
                    }
                } catch (err) {
                    console.error('上傳照片失敗:', err);
                    alert(`上傳失敗: ${err.message || '連線逾時'}`);
                } finally {
                    setUploadStatus(null);
                    if (fileInputRef.current) fileInputRef.current.value = '';
                }
            };

            const currentEditingCard = cards.find(c => c.id === editingCardId) || cards[0];
            const currentEditingTemplate = templates.find(t => t.id === currentEditingCard?.templateId) || templates[0];

            const updateEditingCard = (fields) => {
                if (!currentEditingCard) return;
                const updated = cards.map(c => c.id === currentEditingCard.id ? (window.WorkspaceStore ? window.WorkspaceStore.mergeCard(c, fields) : { ...c, ...fields }) : c);
                saveCards(updated, currentEditingCard.id);
            };

            return (
                <div className="h-screen flex flex-col bg-[#07080c] text-zinc-200 overflow-hidden">
                    {!isUnlocked && (
                        <PasswordLockGate onUnlock={() => setIsUnlocked(true)} />
                    )}

                    {toastMessage && (
                        <div className="fixed top-5 left-1/2 -translate-x-1/2 z-50 px-4 py-2 bg-emerald-500 text-zinc-950 font-bold rounded-lg shadow-xl text-xs flex items-center gap-2 animate-bounce">
                            <i className="fa-solid fa-circle-check"></i>
                            <span>{toastMessage}</span>
                        </div>
                    )}

                    {/* 頂部導覽列模組 */}
                    <WorkspaceNavbar
                        currentView={currentView}
                        setCurrentView={setCurrentView}
                        activeGalleryTab={activeGalleryTab}
                        setActiveGalleryTab={setActiveGalleryTab}
                        cardsCount={cards.length}
                        templatesCount={templates.length}
                        editingTemplate={editingTemplate}
                        setEditingTemplate={setEditingTemplate}
                        currentEditingCard={currentEditingCard}
                        editorPreviewDevice={editorPreviewDevice}
                        setEditorPreviewDevice={setEditorPreviewDevice}
                        onSaveTemplate={() => handleSaveTemplate(editingTemplate)}
                        onCloudPublish={() => handleCloudPublish(currentEditingCard)}
                        onExportAllJSON={exportAllJSON}
                        syncStatus={syncStatus}
                        onForceSync={() => window.WorkspaceStore && window.WorkspaceStore.forceSyncNow(cards, templates)}
                    />

                    {/* 首頁大畫廊 (默認進入！內部獨立流暢滾動) */}
                    {currentView === 'gallery' && (
                        <main className="flex-1 w-full gallery-scroll-container custom-scrollbar p-6 md:p-8">
                            <div className="max-w-7xl mx-auto">
                            {activeGalleryTab === 'cards' && (
                                <CardsGallery
                                    cards={cards}
                                    templates={templates}
                                    onCreateCard={handleCreateCard}
                                    onDuplicateCard={handleDuplicateCard}
                                    onDeleteCard={handleDeleteCard}
                                    onPreviewCard={(c, t) => setPreviewModalCard({ card: c, template: t })}
                                    onEditCard={(id) => {
                                        setEditingCardId(id);
                                        setCurrentView('card_editor');
                                    }}
                                    onCloudPublish={handleCloudPublish}
                                />
                            )}

                            {activeGalleryTab === 'templates' && (
                                <TemplatesGallery
                                    templates={templates}
                                    onCreateTemplate={handleCreateTemplate}
                                    onDuplicateTemplate={handleDuplicateTemplate}
                                    onDeleteTemplate={handleDeleteTemplate}
                                    onPreviewTemplate={(t) => setPreviewModalCard({ card: TEMPLATE_DUMMY_CARD, template: t })}
                                    onEditTemplate={(t) => {
                                        setEditingTemplate({ ...t });
                                        setCurrentView('template_editor');
                                    }}
                                />
                            )}
                            </div>
                        </main>
                    )}

                    {/* 卡片編輯器模式 (模組化組件 js/editor_views.js) */}
                    {currentView === 'card_editor' && currentEditingCard && (
                        <CardEditorView
                            currentEditingCard={currentEditingCard}
                            currentEditingTemplate={currentEditingTemplate}
                            templates={templates}
                            editorPreviewDevice={editorPreviewDevice}
                            updateEditingCard={updateEditingCard}
                            saveTemplates={saveTemplates}
                            setTemplates={setTemplates}
                            handleImageUpload={handleImageUpload}
                            uploadStatus={uploadStatus}
                            fileInputRef={fileInputRef}
                        />
                    )}

                    {/* 模板設計工坊模式 (模組化組件 js/editor_views.js) */}
                    {currentView === 'template_editor' && editingTemplate && (
                        <TemplateEditorView
                            editingTemplate={editingTemplate}
                            setEditingTemplate={setEditingTemplate}
                            editorPreviewDevice={editorPreviewDevice}
                            posterAutoLoop={posterAutoLoop}
                            setPosterAutoLoop={setPosterAutoLoop}
                            posterLoopInterval={posterLoopInterval}
                            setPosterLoopInterval={setPosterLoopInterval}
                        />
                    )}

                    {/* 模組化彈窗 */}
                    <PreviewModal
                        modalCard={previewModalCard}
                        onClose={() => setPreviewModalCard(null)}
                        onCloudPublish={handleCloudPublish}
                    />

                    <CloudShareModal
                        shareModal={cloudShareModal}
                        onClose={() => setCloudShareModal(null)}
                        onShowToast={showToast}
                    />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CardForgeApp />);
    </script>
</body>
</html>
